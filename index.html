<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Regulatory Learning & Certification Portal — Sdmbrk Collections</title>
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1C2422; --muted:#5F6B67; --line:#DDE4E1;
  --teal:#0E7C7B; --teal-dk:#0A5B5A; --teal-soft:#E3F1F0;
  --green:#16A34A; --green-dk:#116B33; --green-soft:#E7F6EC;
  --red:#C0392B; --red-soft:#FBEAE7;
  --gold:#C9A227; --amber-soft:#FBF3DC;
  --r:12px; --sh:0 1px 3px rgba(28,36,34,.08),0 4px 14px rgba(28,36,34,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hbar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.brand .k{font-size:10px;letter-spacing:.22em;color:var(--teal);font-weight:700}
.brand .t{font-size:16px;font-weight:700}
.hspace{flex:1}
.adm-pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.adm-pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:26px 0 6px}
h1.page{font-size:26px;font-weight:750;letter-spacing:-.01em}
h2.sec{font-size:18px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);transition:.15s}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-dk)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.grn:hover{background:var(--green-dk)}
.btn.dngr{color:var(--red)}
.btn.dngr:hover{border-color:var(--red)}
.btn.dngr.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
.field textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--teal-soft);border-color:var(--teal)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:14px}
.catcard{padding:20px;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.catcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(28,36,34,.12)}
.catcard .cico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--teal-soft)}
.catcard h3{font-size:17px;font-weight:700}
.catcard .meta{font-size:12.5px;color:var(--muted);margin-top:auto;display:flex;gap:12px;flex-wrap:wrap}
.catcard.ph{opacity:.62;cursor:default;border-style:dashed}
.catcard.ph:hover{transform:none;box-shadow:var(--sh)}
.tagline{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.12em;padding:3px 9px;border-radius:99px}
.tag-act{background:var(--green-soft);color:var(--green-dk)}
.tag-ph{background:#EEF1EF;color:var(--muted)}
.catcard.addnew{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600;opacity:.9}
.catcard.addnew:hover{color:var(--teal);border-color:var(--teal)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--teal);border-color:var(--teal)}
.doclist{display:flex;flex-direction:column;gap:10px}
.docrow{display:flex;align-items:center;gap:14px;padding:14px 16px}
.docrow .dico{width:38px;height:38px;border-radius:9px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.docrow .dnm{font-weight:600;word-break:break-word}
.docrow .dsz{font-size:12px;color:var(--muted)}
.docrow .dsp{flex:1}
.viewerbox{margin-top:14px}
.viewerbox iframe{width:100%;height:72vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.studysec{padding:18px 20px;margin-bottom:14px}
.studysec h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.studysec .snum{width:26px;height:26px;border-radius:7px;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.studysec .stitle{flex:1}
.studysec .chev{color:var(--teal);font-size:14px;transition:.2s;flex-shrink:0}
.coverimg{max-width:100%;border-radius:9px;border:1px solid var(--line);margin-top:12px;display:block}
.togbar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:9px;border:1.5px dashed var(--line);border-radius:9px;color:var(--teal);font-weight:600;font-size:13.5px;transition:.15s}
.togbar:hover{border-color:var(--teal);background:var(--teal-soft)}
.secbody{margin-top:4px}
.notes{margin-top:10px;font-size:14.5px}
.notes h4{font-size:14px;font-weight:700;margin:14px 0 4px;color:var(--teal-dk)}
.notes ul{padding-left:20px;margin:6px 0}
.notes li{margin:3px 0}
.notes p{margin:6px 0}
.notes table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13.5px}
.notes th{background:var(--teal-soft);text-align:left}
.notes th,.notes td{border:1px solid var(--line);padding:7px 10px}
.notes img{max-width:100%;border-radius:9px;border:1px solid var(--line);margin:8px 0;display:block}
.notes .warnbox{background:var(--amber-soft);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13.5px}
.imggal{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.imggal .thumb{position:relative}
.imggal img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imggal .rm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.imggal .tag{position:absolute;bottom:3px;left:3px;background:rgba(28,36,34,.75);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.qwrap{max-width:720px;margin:0 auto}
.qprog{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0}
.qprog i{display:block;height:100%;background:var(--teal);transition:.3s;border-radius:99px}
.qcard{padding:24px}
.qnum{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.qtext{font-size:17px;font-weight:650;margin:8px 0 18px;line-height:1.45}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt .ol{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;background:#fff}
.opt.sel .ol{background:var(--teal);border-color:var(--teal);color:#fff}
.qnav{display:flex;gap:10px;margin-top:18px;align-items:center}
.qdots{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}
.qdot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);background:#fff}
.qdot.ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-dk)}
.qdot.cur{outline:2px solid var(--teal)}
.result{max-width:640px;margin:30px auto;text-align:center;padding:36px 26px}
.scorering{width:150px;height:150px;margin:0 auto 16px;position:relative}
.scorering svg{transform:rotate(-90deg)}
.scorering .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.scorering .pct small{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.verdict{font-size:38px;font-weight:850;letter-spacing:.04em;margin:6px 0}
.verdict.pass{color:var(--green)}
.verdict.fail{color:var(--red)}
.rline{color:var(--muted);font-size:14px;margin-bottom:20px}
.review{max-width:720px;margin:20px auto;text-align:left}
.rvq{padding:15px 17px;margin-bottom:10px;border-left:4px solid var(--line)}
.rvq.ok{border-left-color:var(--green)}
.rvq.bad{border-left-color:var(--red)}
.rvq .rq{font-weight:650;margin-bottom:5px}
.rvq .ra{font-size:13.5px;margin:2px 0}
.rvq .expl{font-size:13px;color:var(--muted);margin-top:6px;background:var(--bg);padding:8px 10px;border-radius:8px}
.mback{position:fixed;inset:0;background:rgba(20,26,24,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.modal h3{font-size:18px;font-weight:700;margin-bottom:14px}
.modal.wide{max-width:900px}
.admbox{padding:18px 20px;margin-bottom:16px}
.admbox h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.qbrow{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:13.5px}
.qbrow .qbq{flex:1;font-weight:600}
.qbrow .qbmeta{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.emptybox{padding:34px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);font-size:14px}
.certprev{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
.crumb{font-size:13px;color:var(--muted);margin-top:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--ink)}
.crumb button{color:var(--teal);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-family:ui-monospace,Consolas,monospace;word-break:break-word}
footer.app{max-width:1100px;margin:0 auto;padding:26px 16px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--line)}
@media(max-width:640px){
  h1.page{font-size:21px}
  .verdict{font-size:30px}
  .qcard{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header><div class="hbar">
  <div class="brand" id="brandhome">
    <span class="k">SDMBRK COLLECTIONS</span>
    <span class="t">Regulatory Learning &amp; Certification Portal</span>
  </div>
  <div class="hspace"></div>
  <button class="adm-pill" id="admbtn">Admin: OFF</button>
</div></header>
<div class="wrap" id="app"></div>
<footer class="app">Regulatory Learning &amp; Certification Portal · Built for site &amp; office use · <b>Sdmbrk Collections</b></footer>
<div class="toast" id="toast"></div>
<script>
function el(tag,attrs,kids){var n=document.createElement(tag);attrs=attrs||{};
for(var k in attrs){if(k==='cls')n.className=attrs[k];else if(k==='text')n.textContent=attrs[k];else if(k==='html')n.innerHTML=attrs[k];else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),attrs[k]);else if(k==='style')n.setAttribute('style',attrs[k]);else n.setAttribute(k,attrs[k]);}
(kids||[]).forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
function div(cls,kids){return el('div',{cls:cls},kids);}
function btn(label,cls,fn){return el('button',{cls:'btn '+(cls||''),onclick:fn,text:label});}
function mount(node){var a=document.getElementById('app');a.innerHTML='';a.appendChild(node);window.scrollTo(0,0);}
var toastT=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}
function armBtn(b,fn,label){
  var armed=false,timer=null;
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.classList.add('armed');b.textContent='Tap again to confirm';timer=setTimeout(function(){armed=false;b.classList.remove('armed');b.textContent=label;},3500);}
    else{clearTimeout(timer);fn();}
  });return b;}
function uid(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function fmtBytes(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';}
function todayStr(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});}
function secImgs(s){return s.imgs||(s.img?[s.img]:[]);}

var LS='rlcp_v1';
var S=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast('Save failed — storage may be full (large images). Remove some images.');}}
function load(){
  try{S=JSON.parse(localStorage.getItem(LS));}catch(e){S=null;}
  if(!S){S=seedState();S.ver=4;save();return;}
  if(!S.ver||S.ver<2){
    var dc=null;S.cats.forEach(function(c){if(c.id==='dubai-codes')dc=c;});
    if(dc){
      dc.sections=dc.sections.filter(function(s){return s.title!=='DBC Overview & Applicability';});
      var pa=seedPartA();
      for(var i=pa.length-1;i>=0;i--)dc.sections.unshift(pa[i]);
    }
    S.ver=2;
  }
  if(S.ver<3){
    S.cats.forEach(function(c){(c.sections||[]).forEach(function(s){if(!s.imgs)s.imgs=s.img?[s.img]:[];});});
    S.ver=3;
  }
  if(S.ver<4){
    S.cats.forEach(function(c){if(!c.passMark)c.passMark=70;});
    S.ver=4;
  }
  save();
}
var idb=null;
function idbOpen(cb){
  if(idb)return cb(idb);
  var rq=indexedDB.open('rlcp_pdfs',1);
  rq.onupgradeneeded=function(e){e.target.result.createObjectStore('pdfs',{keyPath:'id'});};
  rq.onsuccess=function(e){idb=e.target.result;cb(idb);};
  rq.onerror=function(){toast('Storage unavailable — PDFs cannot be saved');};
}
function pdfPut(rec,cb){idbOpen(function(db){var tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(rec);tx.oncomplete=cb;tx.onerror=function(){toast('PDF save failed (file too large?)');};});}
function pdfGet(id,cb){idbOpen(function(db){var rq=db.transaction('pdfs').objectStore('pdfs').get(id);rq.onsuccess=function(){cb(rq.result);};});}
function pdfDel(id,cb){idbOpen(function(db){var tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').delete(id);tx.oncomplete=cb;});}

function seedState(){
  return {
    adminPass:'sdmbrk', adminOn:false,
    results:[],
    cats:[
      { id:'dubai-codes', name:'Dubai Codes', icon:'🏗️', active:true,
        desc:'Dubai Building Code (DBC 2021) — study notes, reference documents and certification exam.',
        docs:[], sections: seedOfficialParts(), questions: seedQuestions(),
        examName:'Dubai Building Code Certification', quizCount:20, passMark:70 },
      { id:'dewa', name:'DEWA Regulations', icon:'⚡', active:false,
        desc:'DEWA Regulations for Electrical Installations — coming soon.',
        docs:[],sections:[],questions:[],examName:'DEWA Regulations Certification',quizCount:20,passMark:70},
      { id:'dcd', name:'Dubai Civil Defense', icon:'🧯', active:false,
        desc:'UAE Fire & Life Safety Code of Practice — coming soon.',
        docs:[],sections:[],questions:[],examName:'DCD Fire & Life Safety Certification',quizCount:20,passMark:70}
    ]
  };
}
function seedPartA(){
 return [
 {id:uid(),title:'Part A §A.1 — Objectives & Basis of the DBC (2021)',imgs:[],notes:
"## What the DBC is for\n- Unifies building design regulation across all of Dubai under one code, replacing the fragmented authority-by-authority system.\n- Sets MINIMUM requirements only — nothing stops a design exceeding them.\n## The four mandated objectives\n- Health, safety, welfare and convenience of people IN and AROUND buildings.\n- Same protection for people who might be AFFECTED by buildings (neighbours, public).\n- Reducing building impact on the surrounding environment.\n- Sustainable development of buildings.\n## Where its content came from\n- Existing regulations from the various Authorities and Service Providers.\n- Stakeholder interviews (Authorities, Service Providers, Master Developers, Consultants) to find gaps and inconsistencies.\n- Benchmarking against international and regional codes.\n- Arranged by THEMES (Parts) to integrate all elements of building design.\n!! Exam trap: DBC = minimum requirements. Higher standards are always permitted."},
 {id:uid(),title:'Part A §A.2 — Key Definitions',imgs:[],notes:
"## People & entities\n- Architect / Engineer / Civil Engineer: person in charge of design or supervision AND licensed to practise in Dubai under applicable legislation.\n- Consultant: gives consulting advice during design or construction; licensed in Dubai.\n- Contractor: carries out construction works; licensed for contracting in Dubai.\n- Developer: prepares land, constructs buildings, creates subdivisions, rehabilitates buildings.\n- Owner: anyone with legal/equitable interest registered as owner — includes long-term leaseholders and the Main/Sub-Developer for unsold units.\n- Authority: any ministry, department or government institution connected to implementing the DBC.\n## Works on existing buildings (know the ladder!)\n| Term | Meaning |\n| Renovation | Linings/finishes change or structural strengthening — NO internal reconfiguration |\n| Modification | Fit-out of a space/unit, or change to a service system or building element |\n| Reconstruction | Modification that is NOT standalone — affects adjacent egress/systems, larger part may need closing |\n| Change of use | New occupancy different from original design |\n| Addition | Increase in gross/built-up area, height or depth |\n## Dwellings\n- Villa: separate building on its own plot, all floors for ONE family, independent parking + external open space.\n- Townhouse: multiple villas connected by one or more walls in a series.\n## Design approaches\n- Prescriptive design: meets the written requirements entirely.\n- Performance-based design: follows prescriptive route but substitutes alternative solution(s) equal or better for some aspect(s).\n## Spaces\n- Habitable space: living/sleeping/eating with continuous occupancy. Bathrooms, closets, halls, storage, utility = NOT habitable.\n- Occupiable space: enclosed space where people congregate (amusement, labour, education).\n!! Renovation vs Modification vs Reconstruction is a favourite consultant/exam distinction — memorise the ladder."},
 {id:uid(),title:'Part A §A.3 — References, Acronyms & Verbal Forms',imgs:[],notes:
"## Essential cross-references (Ref. A.1–A.7)\n- UAE Fire & Life Safety Code of Practice 2018 (UAE FLSC) — Ministry of Interior Civil Defence. THE fire companion to the DBC.\n- Dubai Universal Design Code 2017 — accessibility.\n- DHA regulations + DHA Health Facility Guidelines — healthcare design.\n- DTCM hotel classification criteria — star ratings.\n- DCAA no-objection certificate — buildings in aviation easement areas (above and below 300 m).\n- UK CDM Regulations 2015 — reference for safe-by-design principles.\n## Verbal forms — MANDATORY knowledge\n| Word | Meaning in DBC |\n| Shall | Mandatory |\n| Should | Recommended |\n| May | Permitted |\n## Acronyms worth memorising\n- DM (Dubai Municipality), DDA, Trakhees, DSOA — planning authorities replaced/unified by DBC.\n- DEWA, IACAD — incorporated or cross-referenced.\n- SIRA (security, Part J), TRA (telecom, G.11), RTA (right of way), DCAA (heights), KHDA (education licensing).\n- FAR, GFA, GA, NA — area terms. DLTM — Dubai Local Transverse Mercator. BIM, MEP.\n!! Shall / should / may distinctions decide what is enforceable. 'Shall' lines are the exam material."},
 {id:uid(),title:'Part A §A.4 — Relationship to Other Regulations & Hierarchy',imgs:[],notes:
"## What the DBC replaces vs keeps\n- REPLACES building-design regulations of DM, DDA, Trakhees and DSOA.\n- INCORPORATES or cross-references DEWA and IACAD requirements.\n- SUMMARISES SIRA security rules (Part J); follows TRA federal telecom rules (G.11).\n- UAE FLSC remains in force — cross-referenced throughout.\n- Accessibility parts of Dubai Universal Design Code absorbed into Part C.\n- DHA + federal rules still govern healthcare facilities; DTCM sets hotel star criteria (DBC compliance ≠ star rating — consult DTCM early).\n- KHDA / Ministry of Education license schools but give no separate design rules.\n- RTA (right of way) and DCAA (flight-path height limits) still apply.\n- Planning/development regulations by developers or planning authorities are NOT replaced; DBC Part B planning rules apply only where plot-specific DCR is unavailable.\n## International codes\n- DBC relies mainly on BS EN and American codes — use LATEST edition unless the DBC pins an edition (e.g. ASCE/SEI 7-2016 in structures).\n- An edition is pinned either because cross-references are version-specific or because that edition was reviewed for Dubai.\n## Hierarchy (A.4.3)\n- DBC + UAE FLSC together = the main regulations for building design in Dubai.\n- Then SIRA (security), TRA (telecom), essential references in each Part.\n- 'Further reading' lists are informative only — not requirements.\n- Conflict between DBC and referenced codes → MOST RESTRICTIVE / highest performance wins.\n- Conflict between a general and a specific DBC requirement → SPECIFIC wins.\n## Safe by design (A.4.4)\n- Consultant addresses health & safety across the whole building lifecycle (contractors, maintenance, occupants, visitors, demolition).\n- Documented in a RISK REGISTER: acknowledge risk → investigate mitigation → design solution reducing risk to practicable level.\n- NOT mandated in the first edition, but expected to be enforced in future revisions.\n!! Two conflict rules — most restrictive between codes; specific over general within the DBC. Both are classic exam questions."},
 {id:uid(),title:'Part A §A.5 — Scope, Occupancies & Exclusions',imgs:[],notes:
"## Applies to\n- New buildings, plus changes to existing buildings: renovation, modification, reconstruction, change of use, addition — DBC + UAE FLSC apply to the changed area and anything impacted by it.\n- For an ADDITION relying on the existing building for escape/vertical transport, the EXISTING building must also be assessed.\n## Occupancy classes (Table A.2)\n- Assembly, Business, Educational, Hotel establishment, Residential (incl. villas & townhouses), Parking, Retail, Mall, Industrial, Storage.\n## DBC does NOT apply to\n- Infrastructure: bridges, tunnels, culverts, metro stations, hydraulic structures, buried/overhead utilities, power stations, antennas/masts, wind turbines, nuclear.\n- Marine structures: canals, dams, dikes, piers, jetties, wharves.\n- Oil & gas: petrochemical facilities, refineries, LNG terminals, platforms, tanks.\n- Temporary/support structures: tents, cranes, storage racks, scaffolding, formwork, falsework.\n- Special loading structures: stadia, grandstands, silos, chimneys.\n- Historical buildings keeping original character (follow relevant Authority guidelines).\n- Heritage buildings DO follow the DBC, but the heritage department controls elevation & façade.\n- Villas & townhouses: addressed in Part K.\n!! Heritage vs historical: heritage follows DBC (with façade control); historical is outside DBC. Easy marks."},
 {id:uid(),title:'Part A §A.5.2 — Area & Height Definitions (GFA, Built-up, GA/NA)',imgs:[],notes:
"## GFA (gross floor area)\n- Used by planning authorities: FAR = GFA ÷ plot area.\n- Sum of all floors measured to the exterior surface of external walls and centrelines of common walls; excludes cornices, brackets, façade cladding.\n- Consultants use the DBC definition + tables unless the DCR states GFA.\n## GFA quick memory table (condensed from Table A.3)\n| Included | Excluded |\n| Habitable/occupiable spaces + sanitary | Parking, parking lobbies, internal roads |\n| Mezzanines, lobbies, corridors, stairs | Mechanical/service rooms, ducts, MEP plant floors |\n| Elevator shaft at recall floor only | Elevator shafts other floors + machine rooms |\n| Basement habitable areas (non-villa) | Villa basements, storage below ground |\n| Storage on ground & above | Shafts, refuse chutes, waste rooms |\n| Base of double-height volumes/atria | Voids, floor voids, terraces, balconies |\n| Gym area beyond 50% of roof area | Gym ≤50% of roof area, pools + services, prayer/ablution, open arcades |\n## Built-up area\n- Total constructed area from external walls INCLUDING balconies, terraces, projections, covered parking, corridors, basements, service floors, indoor pools.\n- EXCLUDES: shafts/courtyards (incl. MEP shafts, refuse chutes), uncovered landscape/hardscape, lightweight shading (pergolas, standalone canopies).\n## GA and NA\n- Gross area (GA): inside perimeter of exterior walls; excludes shafts/courtyards; includes corridors, stairs, ramps, closets, atria bases, interior wall thickness. Used for occupant load.\n- Net area (NA): actual occupied area only — no corridors, stairs, ramps, toilets, mech rooms, closets.\n## Building height\n- Checked against DBC, DCR/affection plans, UAE FLSC and (in aviation easement areas) DCAA rules — each defines height slightly differently, so check ALL.\n!! Gym 50% rule applies to gyms anywhere in the building even though it references roof area."},
 {id:uid(),title:'Part A §A.6–A.9 — Navigation, Adoption, Alternative Solutions, Maintenance',imgs:[],notes:
"## Structure of the code (A.6)\n- Parts: A General · B Architecture · C Accessibility · D Vertical transportation · E Building envelope · F Structure · G Incoming utilities · H Indoor environment · J Security · K Villas.\n- Each Part opens with PERFORMANCE STATEMENTS (broad outcomes). Follow the prescriptive requirements → performance statements deemed met → Authority accepts.\n- Sustainability minimums embedded in relevant Parts; rating systems encouraged beyond minimum.\n- Each Part has its own definitions, essential references (enforceable) vs further reading (informative), and annexes (explanatory).\n## Adoption (A.7)\n- Final approved design already issued → DBC conformity NOT required.\n- In design without final approval → DBC applies.\n- DBC often LESS stringent than the old rules (non-HSE requirements removed) → benefit to adopt.\n## Alternative solutions (A.8)\n- Permitted when prescriptive requirements can't reasonably be met, or for existing-building changes where compliance cost is disproportionate.\n- Must meet performance-statement intent and give AT LEAST equivalent performance to ALL prescriptive requirements.\n- Applied HOLISTICALLY — a change in one Part must not degrade performance elsewhere.\n- For existing buildings: maintain current compliance level or improve toward DBC/FLSC.\n- The AUTHORITY decides acceptance; the CONSULTANT carries the burden of proof.\n- Alternative international standards allowed where Authority permits and intent is met.\n## Maintenance & housekeeping (A.9–A.11)\n- DBC is electronic/interactive; updated on a 2–3 year cycle with addendums between — always check you're on the latest version.\n- 2021 = first edition; future amendments will be side-lined in text.\n- Copyright: DBC content may not be copied, printed, sold or reproduced in any format.\n- Coordinate system: Dubai Local Transverse Mercator (DLTM); levelling reference = Port Rashid.\n!! Burden of proof for alternative solutions sits with the Consultant, decision with the Authority — never the Contractor."},
 {id:uid(),title:'Part A §A.12 — Dimensions, Units & Calculations',imgs:[],notes:
"## Dimensions (A.12.1)\n- Figures/diagrams: millimetres WITHOUT units, unless over 1,000 mm → then metres WITH units (m).\n- Not stated as max or min → the dimension is ABSOLUTE.\n- Conventional industry tolerances apply, except where a min–max range is explicitly stated.\n## Units (A.12.2)\n- All quantities metric, units defined.\n- Engineering in dynamically consistent units — either SI, mm-t-s, or mm-kg-ms systems.\n- Dimensions across analysis models, drawings and BIM must be fully coordinated and consistent.\n## Calculations (A.12.3)\n- Ratio/percentage calcs for required counts (parking, sanitary, etc.) that give fractions → ROUND UP to the next whole number. Always.\n!! Fractional results always round UP — 10.1 parking spaces means 11. Straight exam material."},
 ];
}

"## Key dimensional requirements (typical villa/residential)\n| Element | Minimum requirement |\n| Door clear width (habitable rooms) | 800 mm clear |\n| Accessible entrance door | 850–900 mm clear |\n| Corridor width (dwelling) | 900 mm |\n| Stair riser (private stair) | max 190 mm |\n| Stair going (private stair) | min 250 mm |\n| Handrail height | 900–1000 mm above pitch line |\n| Guarding height (balconies) | min 1100 mm |\n- Guarding gaps must not allow a 100 mm sphere to pass (child safety).\n- Level thresholds (max 15 mm, chamfered) at accessible entrances.\n## Sanitary provision\n- At least one accessible WC on the entrance level of accessible dwellings.\n!! Balcony guarding on villas is a recurring consultant comment — verify 1100 mm from finished floor level after tiling, not from slab."},
 {id:uid(),title:'Structure & Materials (Part F)',imgs:[],notes:
"## Design basis\n- Loads and combinations generally follow international standards adopted by DBC (dead, imposed, wind per local wind maps, seismic zoning for Dubai). Part F mandates ASCE/SEI 7-2016.\n- Durability: concrete cover and mix designed for hot, saline, sulphate-bearing ground conditions — typical severe exposure classes for foundations.\n## Practical site notes\n- Concrete in foundations commonly requires SRC or PC+GGBS/PFA blends with protective coatings + polythene separation per soil report.\n- Curing is critical in UAE summer: retain moisture minimum 7 days; avoid casting large pours in peak afternoon temperatures.\n!! Hot-weather concreting: max concrete temperature at placement is typically 32°C per specifications — check the project spec, plan ice/chilled water with the batching plant."},
 {id:uid(),title:'Building Services — Electrical & Mechanical (Parts G/H)',imgs:[],notes:
"## Electrical\n- Electrical installations must comply with DEWA Regulations for Electrical Installations (current edition) — DBC incorporates/cross-references DEWA.\n- Standard LV system: 400/230 V, 3-phase, 50 Hz, TN-S earthing per DEWA.\n- Cable sizing to IEC 60228 conductor classes; derate for 50°C ambient and grouping.\n- RCD protection (30 mA) required for socket circuits and wet areas.\n- Telecom rules per TRA, documented in G.11.\n## Mechanical & plumbing\n- Ventilation rates, condensate drainage and fresh-air provision per DBC Part H and Dubai Municipality requirements.\n- Water supply and drainage per DM / ADSSC-aligned standards; backflow prevention on connections to potable water.\n!! Condensate drains from FCUs must be trapped and routed with fall — untrapped condensate lines are a classic snag causing ceiling stains that get mistaken for leaks."},
 {id:uid(),title:'Fire Safety Interface (UAE FLS Code)',imgs:[],notes:
"## Division of responsibility\n- The DBC cross-references the UAE Fire & Life Safety Code of Practice (DCD/Ministry of Interior) for fire matters: compartmentation, escape distances, fire-rated doors, detection & alarm, firefighting systems. Together they form the main building-design regulations.\n## Villa-level essentials\n- Smoke detectors in bedrooms, corridors and living areas connected to a home alarm panel.\n- Kitchen: heat detector (not smoke) to avoid nuisance alarms.\n- Fire-rated door and self-closer where garage connects to dwelling.\n- LPG cylinders: outdoor ventilated enclosure, piping per DCD requirements.\n!! Any deviation on fire systems needs DCD approval — municipality approval alone does not cover fire."},

    {id:uid(),title:'Part B — Architecture',imgs:[],notes:
"## B.4 — General Architectural Provisions\n- Development limits (setbacks, FAR, gate level, access) follow the DCR/affection plan first; DBC applies only where these are silent.\n- Gate level: minimum +300 mm above road edge, or 2–5% slope from road edge to plot access.\n- Building height = road edge level at main access to average FFL of roof. Max allowable height = number of floors × 6 m (e.g. G+10 → 11 × 6 m = 66 m).\n- Setbacks (from Table B.1, ground floor and above): G to G+3 → 3 m from neighbour; G+4 → 3.75 m; G+5 → 4.5 m; G+6 → 5.25 m; G+7 → 6 m; G+8 → 6.75 m; G+9 and G+10+ → 7.5 m. Setback from road is generally 0 (per DCR). Sikka setback measured from sikka centreline, capped at 3 m for sikkas >6 m wide.\n- Allowed within setbacks: boundary wall/fence, landscaping, RMU/substation rooms, basement substructure, pergolas/parking shading, uncovered parking, security/guard rooms, retail-to-retail structures.\n## Balconies, Projections & Guardrails\n- Balconies/projections: min 3 m above sidewalk FFL; min 0.6 m setback from vehicle roads OR 5.5 m height clearance; 4.5 m min height above fire truck accessways; max 10% of facing street width and 1.8 m max projection into ROW.\n- Guardrail (fall protection) required wherever a surface is elevated ≥760 mm above FFL. Guardrail height ≥1,200 mm from FFL/lowest step; sphere test = no 100 mm sphere can pass between members; no climbable horizontal element within 865 mm of guardrail base; max 100 mm gap at floor level.\n- Balcony/terrace doors must NOT be self-locking (risk of accidental lock-out).\n## Building Floors\n- Ground floor: exits shall be separated by 1/3 (sprinklered) or 1/2 (unsprinklered) of building diagonal. Emergency command centre required in malls, amusement parks, high-rise/super high-rise — ground floor, 1 h fire barrier, exterior access preferred.\n- Basement: cannot extend beyond plot limits; basement slab soffit ≤1.2 m above gate level.\n- Roof: structures limited to 50% of roof area, set back ≥1.5 m from envelope (stairs/elevator rooms excluded from setback but count toward the 50%).\n!! Setback and height calculations are classic exam/consultant-comment items — always check DCR first, DBC table is the fallback only.\n\n## B.5 — Minimum Space Requirements\n- Occupant load factors (per Table B.2) drive exit widths and sanitary counts — e.g. concentrated assembly (ballrooms) 0.65 m²/person (net area); less concentrated assembly (restaurants) 1.4 m²/person; enclosed offices 9.3 m²/person GA; open offices 4.6 m²/person GA; retail shops 5.6 m²/person GA.\n- Minimum room sizes: residential bedroom/living room 10.5 m² (min 3 m dimension); residential studio 21 m² (min 3 m); housekeeper/guard room 4.5 m² (min 2.1 m); enclosed kitchen 5.4 m² (min 1.8 m); emergency command centre 19 m² (min 3 m).\n- Kitchen manoeuvring space ≥1.2 m in front of / between counters.\n- Minimum clear heights: offices/retail/classrooms 2.5–2.7 m; residential living/bedroom 2.7 m; common corridors/parking/toilets 2.3 m; stairways 2.03 m above treads, 2.3 m above landings.\n\n## B.6 — Circulation Requirements & Openings\n- Corridor widths: single-loaded assembly/residential 1.5 m, double-loaded 1.8 m; retail 1.8 m; mall pedestrian way (>3,600 m² GA/floor) 3 m single-sided / 6 m double-sided; internal corridors within units 1.0 m; service corridors 1.2 m.\n- Stairways: clear width ≥1,200 mm; riser 100–180 mm (max 10 mm variance within a flight); tread depth ≥280 mm (max 21 mm/m slope); landing height between landings ≤3,660 mm; landing width ≥ stairway width.\n- Regular-use/external stairs (recommended, Table B.6): tread ≥300 mm, riser 150–165 mm, 2–14 steps per flight.\n- Handrails: both sides, mounted 865–965 mm above tread nosing PLUS an additional child rail at 650–750 mm; circular cross-section 32–51 mm diameter; ≥57 mm clearance from wall.\n- Guardrails at stairs: ≥1,200 mm high (1,065 mm if part of a combined stair/guard rail); triangular gaps at open stair sides must not pass a 150 mm sphere.\n- Winders/spiral/curved stairs generally NOT permitted in means of egress (exceptions: industrial/storage/retail mezzanine access only). Spiral stairs: min 660 mm clear width, 2,030 mm headroom, max riser 240 mm.\n- Doors: entry doors 915 mm clear min; bathroom/toilet doors 815 mm; exit doors per UAE FLSC occupant load. Clear distance between two adjacent door openings ≥1.2 m.\n- Windows/daylighting: min 10% window-glazing-to-floor-area ratio for offices, residential living/bedroom, classrooms, mosques; min 150 lux daylight target in bedrooms/living rooms if using modelling in lieu of the ratio.\n- Courtyards: max 23 m high (base to top opening), min 6 m × 6 m plan; >15 m high requires full sprinkler protection; smaller than 6×6 m only allowed if walls match floor fire rating.\n!! Stair riser/tread and corridor-width tables are exam-favourite numbers — memorise 1,200 mm stair width, 100–180 mm riser, 280 mm tread, and the 1.5 m/1.8 m single/double corridor rule.\n\n## B.7 — Building Access & Vehicular Requirements\n- Vehicle access shall be ≥15 m from the chamfered edge of a local road intersection/T-junction; not located directly opposite a T-junction.\n- Internal plot roads: min 3 m one-way / 6 m two-way clear width.\n- Vehicular ramps (Table B.9): straight 12% max slope, 3 m min lane; curved 12% max, 3.5 m lane, 4 m inner radius; helical 8% max, 5 m lane, 6 m inner radius. Min vertical clearance 2.4 m throughout.\n- Parking bay dimensions (Table B.11): parallel 2.5 m × 6 m; 45°/60° bays 2.5 m × 5.5 m; 90° two-way bay 2.5 m × 5.5 m (reducible to 2.5×5 m for limited cases).\n- Parking slope max 4% (max 2% for accessible bays). Wheel stoppers max 120 mm high, min 200 mm wide.\n- Parking ratios (Table B.13, samples): office 1 bay/50 m² NA; retail shop 1 bay/70 m² NA; residential 1BR 1 bay/unit, 3BR 2 bays/unit; cinema 1 bay/3 seats or 20 m² of screen area.\n- Preferred (EV/hybrid/carpool) parking: 5% of total required bays for buildings with >20 bays; malls provide EV charging for 20% of preferred bays.\n- Loading/unloading: access driveway ≥9 m two-way / 4.5 m one-way for heavy vehicles; located to rear/side, never building front. Hotels/malls size for a 12 m truck; industrial for 15 m truck.\n- Bicycle parking: 10% of occupants for student/labour accommodation; 5% of car parking ratio for other buildings; within 30 m of entrance.\n- Ladders: only for maintenance/non-occupied access (never in lieu of required stairs to roofs, LPG tanks, solar systems, or fire pump rooms); ladders >6 m climbing height need cages/lifelines.\n!! Fire pump rooms and roof LPG/solar access must always use a protected RCC exit stairway — ladder/cat-ladder/spiral access is explicitly prohibited by UAE FLSC.\n\n## B.8 — Communal Provisions in Buildings\n- Sanitary fixture counts (Table B.18, samples): offices 1 WC/20 occupants (first 100), then 1/50; retail 1 WC/200 (male); restaurants 1/75 male (first 300); up to 33% of male WCs may be substituted with urinals (non-residential only).\n- Toilet stalls: inside door swing 900×1,500 mm, outside swing 900×1,250 mm; fixture clearance ≥400 mm from side obstruction, ≥750 mm centre-to-centre, ≥750 mm frontal clearance.\n- Cleaner's rooms required for buildings >100 m² GA, min 1.5 m².\n- Feeding/lactation rooms: required in malls/amusement parks >1,000 m² GA or >250 occupants; min 4.5 m², ≥2.1 m per side; at least one within 300 m of any point.\n- Swimming pools: fence ≥1,200 mm high, ≤50 mm gap at base, no 100 mm sphere passage, self-closing/self-latching gate; deck/walkway ≥1.2 m wide around pool; ladder within every 30 m of perimeter; diving board water depth ≥2.5 m (+0.3 m per additional 1 m of board height).\n- Prayer rooms: mandatory in public/business/hotel buildings, separate male/female entrances; capacity = 8% of occupants (<300) or 5% of occupants over 300; prayer line 1,330 mm long, 675 mm per person.\n- Waste management: waste storage room required (buildings >230–460 m² GA get 1.2×1.8 m room; >460 m² sized to container demand); refuse chutes required for residential >G+3 with floor area >250 m², min 600 mm diameter; interim floor waste rooms min 2 m².\n!! Common sanitary facilities for both sexes are NOT allowed except designated family/accessible toilets.\n\n## B.9 — Specific Building Types\n- Mosques: minaret-to-mosque height ratio 3:1; prayer line 1,330 mm, 675 mm/person; women's prayer hall ≥20% of total worshippers, never in basement, screen/opening between halls ≥2.1 m high (ground floor) or ≥1.2 m (women above men); Awqat mosques 100–300 worshippers, Jumaa mosques >300 (secondary hall required if >500).\n- Restaurants/kitchens: floors/walls smooth, non-absorbent, crack-free; kitchen extract per H.4.12.15; cold store doors openable from both sides with safety release.\n- Educational: playground/open space ≥200% of classroom area (30% shaded) for kindergartens/nurseries/schools; nurseries min 0.6 m²/child sand pit; first-grade classrooms ground floor only; nursery bed spacing ≥1,000 mm.\n- Residential — labour accommodation: max 8 workers/room; 1 supervisor room per 40 labourers; first aid room 10 m² per 1,000 workers; double-deck bunk clearance ≥0.9 m, no triple-deck.\n- Staff accommodation: single room 13 m² (min 2.7 m), double 20 m² (min 2.7 m); communal kitchen/dining per 400 m² NA.\n- Student accommodation: single room 7 m² (min 2.4 m), shared 5 m²/student (min 2.4 m).\n- Industrial/warehouse: office space capped at 20% of GA; multi-tenant warehouses need 1 h fire separation.\n- Motor fuel dispensing: driveway between islands ≥5.5 m (1-pump) or ≥8 m (2-pump); prayer rooms for 15% of peak users on highway stations.\n- Hotels: fire separation between suites/standard rooms 1 h rated; room sizing per DTCM classification criteria.\n\n## B.10 — Buildings' Interaction with Outdoor Environment\n- Healthy entrances: entryway grille/mat system ≥3 m long (indoor+outdoor combined) at every regularly-used entrance.\n- Fences/boundary walls: max 3 m height (utility buildings excepted, per operational need).\n- Smoking areas: min 7.5 m from entrances, doors, operable windows and air intakes; requires an Authority permit.\n- Landscape: ≥25% of planted area must use indigenous/adapted species; hardscape shading — steep shading devices SRI ≥29, flat/low-slope devices SRI ≥78; ≥50% of hardscape must be shaded/high-SRI/open-grid/solar-panelled.\n- Sustainable materials: ≥10% of material value from recycled content; ≥10% from regional sources (within 800 km); no asbestos; ≥25% of timber by volume certified/accredited.\n- Environmental Impact Assessment (EIAR/EIAS) required for industrial buildings, hazardous-waste-generating buildings, marina-component buildings, buildings near protected/ecologically sensitive areas.\n\n## B.11 — Wayfinding in Buildings\n- Users must be able to orient themselves within 70 m outdoors / 30 m indoors without confusion.\n- Orientation signs at every corridor intersection and every 30 m.\n- Sign mounting height: over path of travel ≥2,100 mm from FFL to sign bottom.\n- Sign types: Information (orientation), Directional (route decision), Identity (recognition), Advisory/regulatory.\n- Text: both English and Arabic, Arabic aligned right; font size scaled to reading distance (Table B.37 — e.g. 5 m distance needs min 70 mm characters).\n- Digital screens: mounted 1,600–2,000 mm high, 15–30° incline, visible from ≥1,000 mm."},

"## C.4 — Accessibility General Requirements\n- Part C applies to all new buildings/facilities and common parts of multi-occupancy residential; it does NOT apply to individual villas/townhouses (see Part K instead).\n- People of determination must receive an equal level of emergency protection (alarm, refuge, evacuation) as everyone else — cross-referenced to UAE FLSC.\n- Wherever a building segregates by gender, BOTH genders must receive the same level of accessibility.\n\n## C.5 — Accessible Routes & Circulation\n- At least one accessible route must connect: site arrival points (parking, sidewalks, transit stops) → accessible entrance → every storey/mezzanine → every accessible space/element within the building.\n- Accessible route widths: external 1,200 mm min (1,800 mm recommended for two-way/heavy traffic); internal 1,000 mm min (1,200 mm recommended); turning/direction-change spaces 1,500 mm min.\n- Passing spaces (1,500×1,500 mm) required at max 50 m intervals where route is under 1,500 mm wide.\n- Max running slope before a ramp is required: 5%; max cross-slope: 2%. Clear height along the route: 2,100 mm minimum.\n- Floor irregularities max 5 mm; uneven surfaces and unprotected level changes must be avoided; tactile warning surface required before any sudden level change.\n- Minimum number of accessible entrances (Table C.2): 1–2 pedestrian entrances → 1 accessible; 3–4 → 2 accessible; >4 → 50% of entrances; assembly/mall/retail/educational/healthcare → 100% of entrances accessible.\n- Protruding objects: nothing below 2,100 mm may protrude more than 100 mm into the route unless it extends to the floor or has a cane-detectable element ≤300 mm from the floor.\n## Reach Ranges (adults)\n- Unobstructed forward reach: 400 mm (low) to 1,200 mm (high). Unobstructed side reach: same range.\n- Obstructed forward reach: reach depth ≤500 mm → high reach 1,200 mm max; 500–600 mm depth → high reach drops to 1,100 mm max.\n- Children's reach ranges (Table C.10): ages 3–4 → 500–900 mm; ages 5–8 → 450–1,000 mm; ages 9–12 → 400–1,100 mm.\n- Switches/controls/sockets: mounted 400–1,200 mm above floor (precision controls 750–1,000 mm); min 300 mm from any corner.\n## Accessible Doors\n- Single doors (except toilets) min 915 mm clear width, 90° opening; double-leaf active leaf min 915 mm; toilet doors min 815 mm.\n- Threshold max 13 mm rise, bevelled to 6 mm, max 50% slope gradient. Opening force ≤25 N unless powered.\n- Door hardware (levers/handles/pulls): mounted 865–1,220 mm above floor, ≥40 mm off the door face; round knobs/thumb latches NOT permitted; closers min 5 s closing time.\n- Manoeuvring clearances (Table C.11) — front approach pull side 1,500 mm wide × 450–600 mm adjacent space; push side 1,200 mm × 300 mm; side approach hinge-pull 1,500 mm × 900 mm; sliding doors 1,200 mm × 300 mm both sides.\n- Public building entrances: all accessible doors shall be power-operated.\n## Ramps\n- Required whenever gradient exceeds 5%. Slope table (Table C.13): rise >1,000 mm → 5–6% recommended / 8.33% max; 500–1,000 mm rise → ≤7% (max 8.33%); <500 mm rise → ≤8% (max 8.33%).\n- Landings required if a ramp run exceeds 10 m; landing min 1,500×1,500 mm at both ends and at any direction change.\n- Ramp clear width (between handrails) min 1,000 mm; cross-slope max 2%.\n- Handrails: 865–965 mm high (plus a child rail at 650–750 mm) on both sides if rise >300 mm; extend 300 mm min beyond top/bottom of each run.\n## Elevators & Lift Platforms\n- At least one accessible elevator required in every building with more than one floor (limited exemptions: two-storey restaurants meeting specific parity conditions, plant rooms, small G+1 buildings <250 m², mosques with accessible ground-floor prayer halls).\n- Accessible cabin sizes (Table C.15): one-entrance cabin min 1,200×1,500 mm (1,500×1,500 recommended); two-opposing-entrance same; stretcher cabin min 1,100×2,100 mm.\n- Door: min 900 mm wide, 2,100 mm high, automatic, min 3 s open, reopen force ≤135 N on obstruction.\n- Manoeuvring space 1,500×1,500 mm in front of doors and hall call button. Buttons 900–1,200 mm high with embossed Arabic numerals + Braille; two handrails at 900±100 mm.\n- Lift platforms (alternative to elevators only where structurally necessary): 900 mm min access width; handrails 865–965 mm; control buttons 900–1,200 mm; open-cabin max travel height 2,000 mm (public) / 3,000 mm (private).\n!! Elevator accessibility exemptions are narrow and specific — don't assume a small building is automatically exempt; check the listed conditions exactly.\n\n## C.6 — Building Access & Vehicular Requirements\n- Curb ramps: running gradient max 8%; curb height 75–150 mm; total width ≥1,200 mm matching the crossing; cross-slope max 2%; tactile warning paving 300 mm from curb edge.\n- Accessible parking count (Table C.17): 25–500 total bays → 2% (min 1); >500 bays → +1% per additional bay over 500; buildings without parking (admin HQ, hospitals, schools, sports, clinics) → minimum 2 bays within 50 m of entrance.\n- Accessible parking dimensions: car angled/perpendicular 2.5×5.5 m; car parallel 2.5×6.0 m; accessible van 3.35×5.5 m.\n- Location rules: max 50 m from building/accessible entrance; at least one adjacent to each accessible entrance; access aisle ≥1,200 mm wide.\n\n## C.7 — Accessible Building Elements\n- Windows: opening force ≤22.2 N; controls 900–1,200 mm high; glazed opening bottom ≤900 mm above floor for views (no transom between 900–1,200 mm) where practical.\n- Floor slip resistance (pendulum test PTV, Table C.19): indoor dry level surfaces 15–35 PTV; outdoor/wet level surfaces 35–45 PTV; inclined ≥5% slope surfaces need 35+ (indoor) or 45+ (outdoor/wet).\n- Floor level differences max 5 mm (or ramped at max 25% for ≤13 mm changes); carpet pile max 13 mm; entrance-lobby carpet max 5 mm height difference from surrounding floor.\n- Tactile warning surfaces: truncated-cone grid, min 300 mm from hazard edge, min 300 mm wide, at all level changes/stairs/ramps/obstacles.\n- Tactile guiding surfaces: min 400 mm wide, longitudinal strips max 32 mm apart, oriented in direction of travel — required in open squares, transit hubs, and between entrances/reception/elevators in public admin buildings.\n- Glass manifestation: required on glass that could be mistaken for an opening/door; band located 750–1,500 mm above FFL, min 50% opacity per 900 mm width interval.\n- Storage/lockers: min 20% of units within 600–1,200 mm reach height.\n- Accessible table height 700–850 mm knee clearance; seating height 430–480 mm, backrest 400–500 mm high.\n- Accessible counters: max 850 mm height, min 900 mm width; ≥1 of each counter type accessible; if sales area >500 m², 20% of counters accessible.\n!! Slip resistance requirements differ for wet vs dry areas — always specify per-area PTV, not one blanket spec.\n\n## C.8 — Accessible Sanitary\n- Minimum accessible toilets (Table C.20): public buildings — 1 accessible facility within 150 m OR one per gender per floor/toilet group; public open spaces (parks/beaches) — within 400 m OR one unisex accessible toilet per floor/group.\n- Fixture minimums (Table C.21): ≥5% of water closets (min 1 per toilet group) wheelchair accessible; ≥1 accessible urinal per urinal group; ≥1 accessible sink per sink group; ≥1 accessible shower/bathtub per bathing area.\n- Accessible toilet stall clear manoeuvring space: 1,500 mm diameter free of obstacles up to 700 mm height; 1,050 mm clear space in front of the door.\n- Water closet: seat height 450–500 mm; grab bars — transfer bars 750–900 mm long, mounted 700–850 mm high; vertical bar 600 mm long at ≥800 mm height, max 300 mm in front of WC.\n- Urinals: bottom lip max 400 mm; min 350 mm deep; interaction space 800×1,300 mm; grab bars each side, max 380 mm from centreline.\n- Sinks: knee clearance 700 mm high × 250 mm deep; usable surface 800–850 mm high; interaction space 800×1,300 mm.\n- Showers: transfer type 900×900 mm; roll-in type 800×1,500 mm min; seat height 450–500 mm; grab bars 700–850 mm high, 750–900 mm long.\n- Family toilets: recommended one per toilet block, mandatory within 300 m; required in malls/parks/amusement parks; manoeuvring space min 2,000 mm diameter, includes adult + child changing boards, second child sink at 500 mm height, urinal at 400 mm.\n- Grab bars (general): circular cross-section 30–50 mm diameter, 45 mm min wall clearance, must withstand 1 kN force in any direction.\n- Drinking fountains: two heights provided — 750–1,200 mm and an accessible one at 750–900 mm.\n\n## C.9 — Accessibility Features in Buildings\n- Hearing enhancement systems (induction loop/infrared/RF) mandatory in: reception areas, meeting/waiting rooms >25 people, auditoriums, service counters, theatres, mosques, cinemas, concert halls.\n- Receiver counts (Table C.24): ≤50 occupants → 2 receivers; 51–500 → 2 + 1 per 25 over 50; 501–1,000 → 20 + 1 per 50 over 500.\n- Service animal relief facilities recommended in large buildings: min 3,000×4,000 mm, 1,200 mm fence, connected to accessible route (not directly into occupied spaces).\n\n## C.10 — Accessibility for Specific Building Types\n- Auditorium wheelchair spaces (Table C.26): 1 space per 50 seats up to 500 seats, then 1 per 100 seats above 500. Companion seats for 50% of wheelchair spaces.\n- Wheelchair space dimensions: single 900 mm wide, two adjacent 850 mm each; front/rear approach 1,300 mm deep, side approach 1,500 mm; manoeuvring space 1,500×1,500 mm.\n- Mosques/prayer rooms: \"KEEP CLEAR\" mat at entrance if space not guaranteed; accessible toilet + ablution space required per gender in each prayer room.\n- Residential adaptable units: new developments with >10 units → min 2% of units + all common areas must be adaptable; kitchen manoeuvring 1,200 mm (1,500 mm where turning required); walls must support 1.5 kN/m² grab-rail loading.\n- Hotel accessible rooms with mobility features (Table C.27): 50–500 rooms → 2% of rooms; >500 → +1% over 500. 50% of these need roll-in showers, 50% need accessible bathtubs.\n- Hotel accessible rooms with communication features (Table C.28): 50–500 rooms → 4%; >500 → +2% over 500.\n- Business/industrial: accessible workstation access aisles min 1,000 mm; lighting min 200 lux at work areas.\n!! Hotel accessible-room percentages (mobility vs communication features) are separate provisions with separate counts — don't merge them into one number.\n\n## C.11 — Signage & Wayfinding Accessibility\n- Text signage: English + Arabic, glare-free, high reflectance contrast; text-to-background contrast min 50 points LRV; pictograms per ISO 7000.\n- Sign mounting: general wall signs centred at 1.5 m height (1.25 m max if primarily for children).\n- Tactile/raised signage: characters raised min 0.8 mm, 16–50 mm high; symbol height min 30 mm; Braille located below the visual text, min 10 mm from sign edge/border.\n- Tactile maps: max horizontal size 800×450 mm; mounted 1,250–1,750 mm (vertical) or 900–1,200 mm (horizontal, 30–45° incline).\n- Communication combinations: an accessible communication process needs at least 2 of the 3 channels (acoustic, visual, tactile) combined — e.g. alphabetical writing + Braille, or light signal + simultaneous sound signal."},
    {id:uid(),title:'Part D — Vertical Transportation',imgs:[],notes:
"## D.1 — Performance Statement\n- The building shall provide a safe, sustainable, adequate and effective vertical transportation service — met by following D.4 to D.9.\n\n## D.4 — General\n- Vertical transportation (VT) covers elevators, escalators and moving walks.\n- Two design methods for minimum passenger elevator count: Method 1 — prescriptive, predefined numbers for single-occupancy buildings (D.8); Method 2 — performance-based design parameters for mixed-use/complex buildings, requires a VT Consultant (D.9).\n- Accessible elevator requirements are defined in Part C (C.5.9.3), not repeated here.\n\n## D.5 — Safety & Reliability\n- VT shall be designed/installed/tested/commissioned/maintained to ONE suite of standards only — either ASME A17 OR BS EN 81. The two suites shall never be mixed on a project.\n- Firefighting elevators additionally conform to UAE FLSC Section 2.9 Ch.2 and Section 3.9 Ch.3, regardless of chosen suite.\n- Escalators/moving walks require enhanced handrail protection at entry points.\n\n## D.6 — Energy Conservation\n- Elevators: AC variable voltage/variable frequency (VVVF) drives on non-hydraulic units; energy-efficient lighting (>70 lumens/circuit-Watt) that auto-shuts after max 5 min inactivity; standby mode for off-peak.\n- Escalators/moving walks: reduce to slower speed after max 3 min no activity; full shutdown after max 15 min no activity (soft-start on restart); photocell detectors at top/bottom landings for both features.\n\n## D.7 — Location & Arrangement of Passenger Elevators\n- Elevators located in the entrance lobby, near the main entrance(s); separated from enclosed parking by an air-conditioned lobby; residential unit doors must NOT open directly into an elevator lobby.\n- Max horizontal travel distance from elevator lobby (Table D.1): residential/hotel 60 m (to furthest unit/guestroom door); open-plan office 60 m; retail/mall/assembly/educational 150 m.\n- Elevator core: max 4 elevators per core; max 8 elevators sharing one lobby (conventional control).\n- In-line arrangement: max 4 elevators, min 2.4 m clearance in front (residential typical floors may reduce to corridor width or 1.8 m, whichever greater).\n- Facing arrangement: max 8 elevators total, distance between cores = greatest of 2.4 m min / 2× deepest cabin depth / 1.5× firefighting cabin depth, capped at 4.5 m max.\n\n## D.8 — Design Method 1: Prescriptive Elevator Counts\n- Based on: building type, population, occupied floors, boarding floors, elevator grouping. Only for single-occupancy buildings with associated parking/retail — NOT for mixed-use (e.g. 50% hotel/50% office needs Method 2).\n- Service elevators (Table D.2 samples): residential 1 minimum (firefighting/passenger elevator may double as service, with scheduled service-mode operation); hotel 1–2-star 1 (+1 per 200 keys over 250); 4–5-star 2 (+1 per 200 keys over 500); office 1; retail/mall 1 (+1 per 100 outlets over 75).\n- Firefighting elevators: mandatory in malls, multi-storey amusement parks, and any high-rise/super high-rise/high-depth building; must access every floor; own dedicated fire-rated RCC shaft; NOT permitted as goods lifts (but permitted as service elevators).\n- Passenger elevator rated speed set from minimum travel-time tables (Table D.4 samples): residential apartments 40–45 s; hotel 4–5-star 20–25 s; office regular 25–30 s; healthcare 25–30 s.\n- Population/occupancy rates used for elevator selection charts: residential apartments — studio 1.5, 1BR 1.8, 2BR 3, 3BR 4, 4BR 5 persons (+1 per extra bedroom); staff accommodation — studio/1BR 2, 2BR 4, 3BR 6; student accommodation same as staff; hotel guest occupancy — 1-/2-/3-star 1.5/room, 4-/5-star 1.8/room.\n- Minimum elevator specs vary by building type and floor count — residential ≤10 floors: 750 kg/10 persons minimum cabin, cabin 1,200×1,500 mm, door 900×2,100 mm; residential >10 floors recommended: 1,350 kg/18 persons, cabin 2,000×1,500 mm.\n- Office buildings (D.8.14): elevator count read from Figure D.22 by boarding floors × occupied floors × GA band (10 m²/person occupancy assumption on 80% of GA); beyond the chart's range, a VT Consultant must be appointed.\n- Retail/mall (D.8.15): population at 1 person/5 m² of leasable+circulation area; escalator/elevator counts scale in bands from Table D.22/D.23 (e.g. <600 persons → optional escalator, 1 set of 2 elevators; 4,501–8,000 → 2 escalator groups, 2 elevator sets).\n- Car parking buildings (D.8.16): occupancy 1.5 persons/car (independent) or 3.0 persons/car (mall/mixed-use parking); assumes max 5 floors above/below ground.\n- Schools (D.8.17): fixed at 2 elevators (service/people-of-determination use only, assumes max 5 storeys). Universities (D.8.18): 2 elevators for first 400 people, +1 per additional 300 people; multiple entrances need 2 elevators each.\n!! Design Method 1 charts only cover SINGLE-occupancy buildings within the tables' population/floor range — exceeding the chart range or mixing occupancies always triggers Method 2 with a VT Consultant.\n\n## D.9 — Design Method 2: Performance-Based VT Design\n- Requires a VT Consultant; must include firefighting/evacuation elevators, service elevators, and waste elevators as needed.\n- Handling capacity HC5% ceiling (Table D.32, samples): residential apartments 7%; hotel 4-/5-star 12–15%; office regular/concentrated 12% (rises to 13% during lunch peak); educational/universities 16–20%.\n- Traffic pattern splits (Table D.34, samples): residential morning 35% up/65% down; office morning peak (single tenant) 85% up/10% down/5% inter-floor; educational morning 100% up.\n- Average waiting time ceiling (Table D.35, samples): residential apartment ≤40 s; hotel 4-/5-star ≤30 s; office ≤35 s; retail/educational/healthcare ≤40 s.\n- Capacity factor ceiling (Table D.36): residential apartments 60–80%; hotel 4-/5-star 50%; office 80%; retail 50%; panoramic elevators capped at 70% regardless of building type.\n- Door timing (Table D.38, samples): residential apartments <120 m — 2.2 s open / 3.2 s close; ≥120 m tall — 1.9 s open / 2.8 s close (faster doors improve efficiency but must be manufacturer-achievable).\n- Acceleration/jerk (Table D.39): scales with speed — e.g. 1 m/s → 0.7 m/s² accel / 0.8 m/s³ jerk; ≥5 m/s → 1.2 m/s² / 1.4 m/s³. Bed elevators capped at 0.6 m/s² accel / 1.0 m/s³ jerk regardless of speed.\n- Destination Control Systems (DCS) preferred where: elevators don't serve equal stops, up-peak traffic is demanding, mixed-use floors, or tenant/visitor enrolment access control is used. DCS trades lunchtime-peak performance and single-file-entry reliability for faster time-to-destination and better lobby organisation.\n- Hybrid systems (destination control at the main boarding floor + conventional elsewhere) help overcome DCS lag during lunchtime peaks.\n\n## D.10 — Annex: Design Summaries & Report Templates\n- Design Method 1 projects submit a \"Vertical Transportation Selection Summary\" (project data, estimated population, elevator/escalator/moving-walk counts, Authority review section).\n- Design Method 2 projects submit a fuller \"VT Performance Approval Summary\" (per-group population, handling capacity, waiting/destination times, speed, door timing, acceleration/jerk) plus a VT Consultant report covering assumptions, selection rationale, traffic analysis and Authority requirements."},
    {id:uid(),title:'Part E — Building Envelope',imgs:[],notes:placeholder('DBC Part E (Building Envelope)','covers façade, insulation, waterproofing and thermal performance requirements.')},
    {id:uid(),title:'Part F — Structure',imgs:[],notes:
"## Design basis\n- Loads and combinations generally follow international standards adopted by DBC (dead, imposed, wind per local wind maps, seismic zoning for Dubai). Part F mandates ASCE/SEI 7-2016.\n- Durability: concrete cover and mix designed for hot, saline, sulphate-bearing ground conditions — typical severe exposure classes for foundations.\n## Practical site notes\n- Concrete in foundations commonly requires SRC or PC+GGBS/PFA blends with protective coatings + polythene separation per soil report.\n- Curing is critical in UAE summer: retain moisture minimum 7 days; avoid casting large pours in peak afternoon temperatures.\n!! Hot-weather concreting: max concrete temperature at placement is typically 32°C per specifications — check the project spec, plan ice/chilled water with the batching plant."},
    {id:uid(),title:'Part G — Incoming Utilities',imgs:[],notes:
"## Electrical supply\n- Electrical installations must comply with DEWA Regulations for Electrical Installations (current edition) — DBC incorporates/cross-references DEWA.\n- Standard LV system: 400/230 V, 3-phase, 50 Hz, TN-S earthing per DEWA.\n- Cable sizing to IEC 60228 conductor classes; derate for 50°C ambient and grouping.\n- RCD protection (30 mA) required for socket circuits and wet areas.\n## Water & drainage\n- Water supply and drainage per DM / ADSSC-aligned standards; backflow prevention on connections to potable water.\n## Telecommunications\n- Telecom infrastructure follows federal TRA regulations, documented in DBC section G.11.\n!! Incoming utilities cover the connection points into the building — DEWA supply, water, drainage and telecom — coordinate all four with the relevant authority/service provider early in design."},
    {id:uid(),title:'Part H — Indoor Environment',imgs:[],notes:
"## Ventilation & mechanical\n- Ventilation rates, condensate drainage and fresh-air provision follow DBC Part H and Dubai Municipality requirements.\n- FCU condensate drain lines must be trapped and routed with fall — untrapped condensate lines are a classic snag causing ceiling stains that get mistaken for leaks.\n!! Indoor environment covers air quality, thermal comfort and ventilation inside the completed building — distinct from the incoming utility connections covered in Part G."},
    {id:uid(),title:'Part J — Security',imgs:[],notes:placeholder('DBC Part J (Security)','summarizes and cross-references SIRA requirements — CCTV, access control and related security systems.')},
    {id:uid(),title:'Part K — Villas',imgs:[],notes:
"## Scope\n- Part K sets villa- and townhouse-specific requirements, read together with the general provisions in Parts A–J.\n## Villa-level fire essentials (cross-referenced to UAE FLSC)\n- Smoke detectors in bedrooms, corridors and living areas connected to a home alarm panel.\n- Kitchen: heat detector (not smoke) to avoid nuisance alarms.\n- Fire-rated door and self-closer where garage connects to dwelling.\n- LPG cylinders: outdoor ventilated enclosure, piping per DCD requirements.\n!! Any deviation on fire systems needs DCD approval — municipality approval alone does not cover fire.\n\nUse ✎ Edit to add further Part K content (setbacks, plot coverage, height limits, parking, etc.) as you go through the PDF."}
  ];

function renderNotes(txt,imgs){
  imgs=imgs||[];
  var box=div('notes'),lines=String(txt||'').split('\n'),i=0;
  while(i<lines.length){
    var L=lines[i];
    var im=L.match(/^\[img:(\d+)\]\s*$/);
    if(im){
      var idx=parseInt(im[1])-1;
      if(imgs[idx])box.appendChild(el('img',{src:imgs[idx],alt:'figure '+im[1]}));
      i++;continue;
    }
    if(/^\|/.test(L)){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}));i++;}
      var tb=el('table');rows.forEach(function(r,ri){var tr=el('tr');r.forEach(function(c){tr.appendChild(el(ri===0?'th':'td',{text:c}));});tb.appendChild(tr);});
      box.appendChild(tb);continue;
    }
    if(/^## /.test(L)){box.appendChild(el('h4',{text:L.slice(3)}));i++;continue;}
    if(/^!! /.test(L)){box.appendChild(div('warnbox',['⚠ '+L.slice(3)]));i++;continue;}
    if(/^- /.test(L)){var ul=el('ul');while(i<lines.length&&/^- /.test(lines[i])){ul.appendChild(el('li',{text:lines[i].slice(2)}));i++;}box.appendChild(ul);continue;}
    if(L.trim()){box.appendChild(el('p',{text:L}));}
    i++;
  }
  return box;
}
function cat(id){return S.cats.filter(function(c){return c.id===id;})[0];}

function modal(title,bodyNodes,wide){
  var back=div('mback');
  var m=div('modal'+(wide?' wide':''),[el('h3',{text:title})]);
  bodyNodes.forEach(function(n){m.appendChild(n);});
  back.appendChild(m);
  back.addEventListener('click',function(e){if(e.target===back)back.remove();});
  document.body.appendChild(back);
  return back;
}

  ]);

function vCat(cid,tab){
  var c=cat(cid);
  var w=div('',[
    div('crumb',[el('button',{text:'Dashboard',onclick:vDash}),el('span',{text:'›'}),el('b',{text:c.name})]),
    el('h1',{cls:'page',text:c.name,style:'margin-top:8px'}),
    el('p',{cls:'sub',text:c.desc})
  ]);
  var tabs=[['study','Study Center'],['docs','Documents'],['exam','Exam'],['results','My Results']];
  if(S.adminOn)tabs.push(['manage','⚙ Manage']);
  var tb=div('tabs');
  tabs.forEach(function(t){tb.appendChild(el('button',{cls:'tab'+(t[0]===tab?' on':''),text:t[1],onclick:function(){vCat(cid,t[0]);}}));});
  w.appendChild(tb);
  var body=div('');w.appendChild(body);
  if(tab==='docs')tabDocs(c,body);
  if(tab==='study')tabStudy(c,body);
  if(tab==='exam')tabExam(c,body);
  if(tab==='results')tabResults(c,body);
  if(tab==='manage')tabManage(c,body);
  mount(w);
}

function tabDocs(c,body){
  if(S.adminOn){
    var urlI=el('input',{placeholder:'https://sdmbrk.github.io/docs/DBC-A.pdf',type:'url'});
    var ub=div('admbox card',[el('h3',{text:'🔗 Add PDF from URL (works on mobile)'}),
      el('p',{cls:'sub',style:'margin-bottom:10px',text:'Host your PDFs on GitHub Pages (sdmbrk.github.io) or any CORS-enabled server, paste the direct link, and the app downloads and stores it permanently in this browser.'}),
      div('field',[urlI]),
      btn('⬇ Fetch & save PDF','pri',function(){
        var u=urlI.value.trim();
        if(!u){toast('Paste a PDF URL first');return;}
        toast('Downloading…');
        fetch(u).then(function(r){
          if(!r.ok)throw new Error('http');
          return r.arrayBuffer();
        }).then(function(buf){
          if(buf.byteLength<100)throw new Error('empty');
          var id=uid();
          var name=decodeURIComponent(u.split('/').pop().split('?')[0])||'document.pdf';
          pdfPut({id:id,name:name,data:buf},function(){
            c.docs.push({id:id,name:name,size:buf.byteLength});save();toast('PDF saved — '+fmtBytes(buf.byteLength));vCat(c.id,'docs');
          });
        }).catch(function(){
          toast('Download failed — check the URL. GitHub Pages links work; some servers block cross-origin requests.');
        });
      })
    ]);
    body.appendChild(ub);
    var up=div('admbox card',[el('h3',{text:'📤 Upload reference PDF from device'}),
      el('p',{cls:'sub',style:'margin-bottom:10px',text:'Use this when the app is opened directly in a browser (like Chrome) rather than an embedded viewer.'}),
      el('input',{type:'file',accept:'application/pdf',id:'pdfup'})]);
    up.querySelector('#pdfup').addEventListener('change',function(e){
      var f=e.target.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        var id=uid();
        pdfPut({id:id,name:f.name,data:fr.result},function(){
          c.docs.push({id:id,name:f.name,size:f.size});save();toast('PDF saved');vCat(c.id,'docs');
        });
      };
      fr.readAsArrayBuffer(f);
    });
    body.appendChild(up);
  }
  if(!c.docs.length){body.appendChild(div('emptybox',['No reference documents yet.'+(S.adminOn?'':' Ask an admin to add the code PDFs.')]));return;}
  var list=div('doclist');
  c.docs.forEach(function(d){
    var row=div('docrow card',[div('dico',['PDF']),
      el('div',{},[el('div',{cls:'dnm',text:d.name}),el('div',{cls:'dsz',text:fmtBytes(d.size)})]),
      div('dsp'),

var QZ=null;
function startQuiz(c,n){
  var pool=c.questions.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  QZ={cid:c.id,qs:pool.slice(0,n),ans:new Array(n).fill(-1),cur:0};
  vQuiz();
}
function vQuiz(){
  var c=cat(QZ.cid),i=QZ.cur,q=QZ.qs[i],n=QZ.qs.length;
  var w=div('qwrap',[
    div('crumb',[el('button',{text:'‹ Exit exam',onclick:function(){vCat(c.id,'exam');}}),div('dsp'),el('b',{text:c.examName})]),
    div('qprog',[el('i',{style:'width:'+Math.round((i+1)/n*100)+'%'})])
  ]);
  var dots=div('qdots');
  QZ.qs.forEach(function(_,di){
    dots.appendChild(el('button',{cls:'qdot'+(QZ.ans[di]>=0?' ans':'')+(di===i?' cur':''),text:String(di+1),onclick:function(){QZ.cur=di;vQuiz();}}));
  });
  w.appendChild(dots);
  var qc=div('qcard card',[el('div',{cls:'qnum',text:'Question '+(i+1)+' of '+n+' · '+q.sec}),el('div',{cls:'qtext',text:q.q})]);
  q.opts.forEach(function(o,oi){

    opt.addEventListener('click',function(){QZ.ans[i]=oi;vQuiz();});

function finishQuiz(){

function shrinkImage(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    var maxW=1400;
    if(img.width<=maxW){cb(dataUrl);return;}
    var scale=maxW/img.width;
    var cv=document.createElement('canvas');
    cv.width=maxW;cv.height=Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',0.82));
  };
  img.onerror=function(){cb(dataUrl);};
  img.src=dataUrl;
}
