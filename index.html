"## F.1\u2013F.4 \u2014 Scope & Performance Statements\n- Primary objective: buildings must safely sustain and transmit all combined dead, imposed (live), wind, thermal and seismic loads to the ground for the intended design life, without structural distress or excessive movement.\n- Structures must avoid damaging adjacent properties/utilities, and remain resilient against disproportionate collapse from accidental loads, explosions or localised structural failures.\n- Standards hierarchy: ASCE 7-16 (Minimum Design Loads) and ACI 318 (Structural Concrete) are primary, alongside relevant Eurocodes (BS EN) and AISC specifications for steel.\n!! Loads are never checked in isolation \u2014 the objective is explicitly COMBINED dead + live + wind + thermal + seismic loading transmitted safely to ground.\n\n## F.5 \u2014 Structural Systems & Robustness\n- Load path continuity: a complete, continuous load path is required from roof level down through gravity AND lateral force-resisting systems (shear walls, core walls, moment frames, diaphragms) to the foundation.\n- Disproportionate collapse resistance (F.5.5): buildings need structural redundancy/integrity to prevent progressive collapse.\n- High-occupancy and high-rise structures require horizontal AND vertical ties, continuous perimeter reinforcement, and key-element design criteria for columns/walls whose failure could compromise a larger structural zone.\n!! \"Key element\" design isn't about every column \u2014 it specifically targets columns/walls whose individual failure would take out a disproportionately large part of the structure.\n\n## F.6 & F.11 \u2014 Materials & Sustainability\n- Reinforced concrete: mixes, durability design, cover to reinforcement and exposure classes follow ACI 318 plus local coastal exposure criteria (protecting against chloride and sulphate attack from aggressive ground).\n- Dubai Sustainable Concrete Baseline (DSCB) Annex (F.11): mandates PARTIAL replacement of Portland cement with supplementary cementitious materials (SCMs) \u2014 GGBS, Fly Ash (PFA) or Silica Fume \u2014 to lower carbon footprint AND increase durability against chemical aggression.\n- Structural steel & fasteners: design follows AISC 360 / BS EN 1993; hot-dip galvanizing or protective anti-corrosion coating is required for structural members exposed to outdoor atmospheric conditions.\n- Prohibited materials: uncertified, high-toxicity or asbestos-containing structural materials are strictly forbidden.\n!! DSCB (F.11) SCM replacement is MANDATORY, not optional best-practice \u2014 and it serves two purposes at once: lower embodied carbon AND better durability against Dubai's aggressive ground/coastal chemistry.\n\n## F.7 \u2014 Structural Loading Specifications\n- Dead loads (D): based on actual material densities of structural elements, architectural finishes, MEP equipment and permanent partitions.\n- Imposed/live loads (L): determined by occupancy classification per ASCE 7-16 / Dubai Municipality minimum guidelines.\n- Wind loads (W): engineered per ASCE 7-16, adjusted for local Dubai wind speed records; tall, slender or geometrically complex structures require site-specific Wind Tunnel Testing (aerodynamic pressures, vortex shedding, cladding loads).\n- Seismic design (E): accounts for regional fault lines/tectonic activity; standard structures use Risk Category II (or higher for critical facilities) per ASCE 7-16; seismic acceleration parameters (Ss, S1) and damping metrics are specified in the F.10 Annex.\n!! Wind Tunnel Testing isn't universal \u2014 it's specifically triggered by being tall, slender or geometrically complex. A standard low/mid-rise box-shaped building typically doesn't need it.\n\n## F.8 \u2014 Performance & Serviceability Limits\n- Deflection limits: vertical deflection of beams/slabs/cantilevers under service loads must stay within strict span-to-deflection ratios (\u2264L/360 or L/480 depending on attached non-structural elements), to prevent partition cracking and glazing damage.\n- Lateral drift & stability: inter-storey drift limits under wind/seismic combinations must satisfy ASCE 7 performance caps; high-rise buildings must also limit dynamic acceleration and human-comfort vibration under wind excitation.\n- Crack width control: RC elements in humid/coastal outdoor or underground environments must limit calculated crack widths, to protect durability and prevent rebar corrosion.\n!! L/360 vs L/480 depends on what's ATTACHED to the element \u2014 the same beam can have a different deflection limit depending on whether brittle finishes/glazing sit below it.\n\n## F.9 \u2014 Geotechnics, Foundations & Ground Work\n- A comprehensive geotechnical site investigation by a licensed geotechnical laboratory is mandatory before foundation engineering.\n- The Geotechnical Interpretive Report (GIR) must evaluate: soil stratification, allowable bearing capacity, soil salinity, potential liquefaction under seismic events, and seasonal groundwater levels.\n- Shallow foundations (isolated/combined footings, raft/mat slabs) are permitted where upper soil layers give sufficient bearing capacity.\n- Deep/piled foundations (bored cast-in-place, friction or end-bearing piles) are required for heavy loads, high-rise towers, or soft/saline soils.\n- Dewatering during excavation must safeguard adjacent buildings against subsidence/soil loss; ground improvement techniques (dynamic compaction, vibro-flotation, soil mixing) require POST-treatment verification testing.\n!! Ground improvement isn't \"apply and done\" \u2014 post-treatment verification testing is a mandatory separate step confirming the technique actually achieved the required ground properties.\n\n## F.12 Annex \u2014 Precast Stairs & Structural Connection Details\n- Precast flight to precast landing: dowel ties, grouted clearance holes, screed toppings and U-bar links.\n- Precast flight to steel beam: welded shear stud ties and U-bar links.\n- Precast flight to in-situ landing: rebar dowels with nib support configurations.\n!! These three precast stair connection types are matched to what the flight lands on (precast landing / steel beam / in-situ landing) \u2014 the connection detail changes with the receiving element, not just the flight itself.\n\n## Practical site notes\n- Concrete in foundations commonly requires SRC or PC+GGBS/PFA blends with protective coatings + polythene separation per soil report \u2014 consistent with the DSCB SCM mandate in F.11.\n- Curing is critical in UAE summer: retain moisture minimum 7 days; avoid casting large pours in peak afternoon temperatures.\n!! Hot-weather concreting: max concrete temperature at placement is typically 32\u00b0C per specifications \u2014 check the project spec, plan ice/chilled water with the batching plant."},

"## G.1\u2013G.3 \u2014 Scope & Performance Objectives\n- Part G governs the planning, design, integration and installation of ALL incoming public and private utilities serving buildings/developments in Dubai.\n- Core objectives: (1) safeguard occupants against electrical fire, arc flash and shock hazards; (2) provide metered water distribution to enable consumption monitoring and conservation; (3) coordinate building cooling demand with incoming district cooling infrastructure; (4) establish future-proof telecom infrastructure with open access for multiple service providers.\n!! Part G is specifically about the CONNECTION POINTS into the building \u2014 electrical, water, cooling, gas and telecom \u2014 distinct from Part H (indoor environment once utilities are inside).\n\n## G.4 \u2014 Electrical Systems Design & Installation\n- Electrical installations must comply with DEWA regulations, standard single-line diagrams (SLD), and applicable IEC/BS EN standards.\n- Standard LV system: 400/230 V, 3-phase, 50 Hz, TN-S earthing per DEWA.\n- Cable sizing to IEC 60228 conductor classes; derate for 50\u00b0C ambient and grouping.\n- Earthing & bonding: a dedicated Main Earthing Terminal (MET) connected to foundation earthing electrodes is required; supplementary equipotential bonding is MANDATORY in high-risk wet areas (bathrooms, kitchens, plant rooms).\n- Distribution boards (DBs), sub-main DBs (SMDBs) and main DBs (MDBs) must be accessible for maintenance, well-ventilated and clearly labelled.\n- Isolation switches, RCDs and circuit breakers must be rated for prospective fault currents \u2014 30 mA RCD protection required for socket circuits and wet areas.\n!! Supplementary bonding in wet areas is a SEPARATE requirement from the main earthing terminal \u2014 having a MET connected to foundation electrodes does not itself satisfy the wet-area bonding rule.\n\n## G.5\u2013G.6 \u2014 EV Charging & Renewable Energy\n- EV charging points: mandatory provision of dedicated electrical supply capacity, cable containment and spatial allowance for EV Supply Equipment (EVSE) across residential, commercial and public parking.\n- EV chargers require dedicated RCD protection, proper earthing, and integration with the building's load management system to prevent overload during peak periods.\n- Onsite solar PV: rooftop/fa\u00e7ade-integrated PV systems must strictly conform to DEWA's \"Shams Dubai\" net-metering grid interconnection standards.\n- PV inverters must include automatic anti-islanding protection \u2014 disconnecting PV generation safely during utility grid outages.\n- PV structural mounting and electrical isolation switches must meet Civil Defence fire safety regulations.\n!! Anti-islanding protection exists to protect utility line workers during an outage \u2014 without it, a building's PV system could keep energising a supposedly de-energised grid line.\n\n## G.7 \u2014 Substations & Medium Voltage (MV) Installations\n- Buildings requiring MV supply must provide a dedicated ground-floor or basement DEWA transformer/substation room with direct exterior vehicular access.\n- Transformer rooms require adequate natural/mechanical ventilation, oil containment bunds, and fire-rated wall/door assemblies.\n- High-voltage switchgear, transformers and Ring Main Units (RMUs) must maintain prescribed working clearances and fire suppression barriers.\n!! Direct exterior vehicular access to the substation room is a specific, easily-missed site-planning requirement \u2014 DEWA needs to be able to deliver/replace a transformer without routing through the building interior.\n\n## G.8 \u2014 Liquefied Petroleum Gas (LPG) Systems\n- Centralised LPG systems serving commercial kitchens, food outlets or residential units must comply with Dubai Civil Defence regulations.\n- Gas detection systems, automatic emergency shut-off (solenoid) valves and explosion-proof fittings are MANDATORY in spaces with gas appliances.\n- Bulk LPG storage tanks or cylinder manifolds must sit in open, well-ventilated outdoor areas with clear safety setbacks from building openings and ignition sources.\n!! This is the building-services-infrastructure version of the LPG rule already seen at villa scale in Part K \u2014 outdoor, ventilated, setback from openings/ignition sources, regardless of building type.\n\n## G.9 \u2014 Water Infrastructure & Metering\n- Every incoming water line requires a DEWA-approved smart MASTER water meter to record bulk consumption.\n- Sub-metering is required for individual residential, retail or commercial tenancies, to track localised usage.\n- Direct connection to pump suction lines is PROHIBITED \u2014 incoming water must discharge into a compliant potable water break tank fitted with air gaps and backflow preventers.\n!! \"No direct connection to pump suction\" is an absolute rule, not a preference \u2014 it exists to prevent negative pressure in the incoming main from pulling contamination back into the public network.\n\n## G.10 \u2014 District Cooling Provisions\n- Buildings served by district cooling must allocate dedicated space for an Energy Transfer Station (ETS) \u2014 containing heat exchangers, primary/secondary pumps and control valves.\n- BTU/thermal energy meters are required on primary cooling lines, to measure exact energy consumption (kWh / Ton-hours) transferred from the utility network.\n- Hydronic isolation: primary chilled water (from the district cooling provider) must be physically separated from secondary chilled water circulating within the building.\n!! Hydronic isolation via the ETS heat exchanger is what allows the district cooling provider's primary loop and the building's own secondary loop to stay at different pressures/water chemistry without ever mixing.\n\n## G.11 \u2014 Telecommunications Infrastructure\n- Telecom infrastructure follows federal TRA regulations, documented in DBC section G.11.\n- Main Telecom Room (MTR): multistorey and commercial buildings require an MTR on ground or basement floor, with dedicated cable risers serving Floor Telecom Rooms (FTRs).\n- Infrastructure must support simultaneous connectivity for licensed telecom operators (du AND Etisalat) via shared Optical Distribution Frames (ODF) \u2014 open access, not single-operator lock-in.\n| Building size | FTTH/FTTT configuration |\n| \u2264256 units | 2\u00d732 LC/APC splitters \u2192 SC/APC patch panels \u2192 4-core indoor drop fibre cables |\n| >256 units | Mini ODF splice cabinets, 2\u00d732 port splitters (Etisalat + du), tight-buffer/micro-module LSZH indoor multicore backbone, flat-profile drop cables to tenant outlets |\n- Standardised patch panels: SC/APC and LC/APC connectors, simplex fibre patch cords, and uniform port labelling required across all telecom cabinets.\n!! The 256-unit threshold is the key number to remember \u2014 it changes both the splitter/cabinet architecture and the backbone cable type, not just the port count."},

"## H.1\u2013H.3 \u2014 Performance Statements & Core Objectives\n- Fixed MEP systems (mechanical, electrical, plumbing) must be energy-efficient, have effective controls, maintain optimal operational efficiency and support occupant health/comfort.\n- Water supply objective: a reliable supply of safe, hygienic water, paired with sanitary fittings selected to minimise overall consumption.\n- Drainage objective: soil, waste and stormwater flows must be collected and conveyed away from the building safely and efficiently.\n- Acoustic objective: occupants must be protected from undue noise from adjacent spaces, adjoining occupancies and the external ambient environment.\n- Lighting objective: adequate artificial lighting for visual comfort and safe movement wherever natural daylight is insufficient.\n- Digital services: infrastructure must enable modern digital services with seamless interoperability across multi-vendor systems.\n!! Part H is organised around outcomes (performance statements) first, then the prescriptive detail in H.4 onward — the same performance-statement structure used across the DBC (see Part A \u00a7A.6).\n\n## H.4 \u2014 HVAC Systems & Occupant Thermal Comfort\n- IAQ & ventilation: mechanical systems must continuously supply conditioned outdoor air, filtering/treating both outdoor and recirculated air to remove particulates and contaminants.\n- Demand-Controlled Ventilation (DCV): densely occupied spaces (auditoriums, meeting rooms, classrooms, event halls) require CO\u2082 sensors that dynamically adjust fresh-air supply to real-time occupant density.\n- The building envelope is the primary thermal barrier \u2014 resisting conductive heat gain, air infiltration, moisture transfer and external noise (cross-references Part E Building Envelope).\n- Cooling load: HVAC must maintain specified indoor temperature/RH setpoints under peak Dubai desert design conditions.\n- VAV systems and intelligent airflow controls are promoted to cut cooling energy during part-load operation.\n- High-exhaust-volume systems require Energy Recovery Ventilation (ERV) or Heat Recovery Ventilation (HRV) to reclaim cooling energy from exhaust air and pre-cool incoming outdoor air.\n- Refrigerants (chillers, DX units, VRF systems, split units) must be zero-ODP and low-GWP, compliant with international environmental protection standards.\n!! DCV via CO\u2082 sensors is specifically required for DENSELY occupied spaces \u2014 don't assume every room needs it; check occupancy density/type first.\n\n## H.5 \u2014 Potable Water Supply Systems\n- Potable water storage tanks and interior distribution must strictly conform to DEWA regulations.\n- Storage tanks: non-toxic, non-corrosive construction, designed against stagnation and bacterial growth (e.g. Legionella) via continuous temperature monitoring and regular flushing protocols.\n- Backflow prevention: Reduced Pressure Zone (RPZ) backflow preventers and air gaps required at utility boundary connections and high-risk equipment feeds, to prevent cross-contamination of the public supply.\n- Water conservation: high-efficiency, low-flow sanitary fittings (lavatory faucets, kitchen sinks, showerheads) with aerators, meeting maximum allowable discharge rates.\n- Water closets must be dual-flush.\n!! RPZ backflow preventers are specifically for utility boundary connections and high-risk equipment feeds \u2014 not a blanket requirement on every fixture.\n\n## H.6 \u2014 Sanitary Drainage & Wastewater Systems\n- Gravity drainage: soil/waste pipework conveys flows by gravity to municipal sewers or approved onsite treatment.\n- Every fixture needs a water trap seal connected to a dedicated vent stack network, to stop sewer gases/odours entering occupied spaces.\n- Inspection chambers are mandatory at ground level at key junction points, for maintenance access and blockage clearing.\n- Grease traps/interceptors are mandatory for commercial kitchens, restaurants, bakeries and food-prep facilities before discharge to the public sewer.\n- Stormwater/rainwater systems must be kept physically SEPARATE from sanitary soil/waste networks \u2014 never combined.\n- Greywater recycling (reclaiming lavatory/shower wastewater) is encouraged for non-potable uses such as WC flushing and landscape irrigation.\n!! System separation (storm vs. sanitary) is a hard rule, not a preference \u2014 cross-connecting the two is a common and serious site defect.\n\n## H.7 \u2014 Artificial Lighting & Controls\n- Task illuminance: minimum lux levels are set per room type for adequate task visibility and safe movement.\n- Lighting Power Density (LPD): maximum W/m\u00b2 caps apply per space classification, to limit electrical load and heat gain.\n- Occupancy/vacancy sensors are mandatory in intermittently-occupied spaces \u2014 restrooms, storage rooms, corridors, conference rooms.\n- Daylight harvesting: perimeter zones with exterior window daylight need automatic daylight dimming or daylight-responsive switching.\n- Fluorescent fixtures must use high-efficiency electronic ballasts \u2014 controls starting voltage, eliminates stroboscopic flicker, improves efficiency.\n!! LPD caps and lux minimums are both mandatory \u2014 a design that hits the lux target by simply adding more fixtures can still fail the W/m\u00b2 ceiling.\n\n## H.8\u2013H.9 \u2014 Commissioning & Fire Safety Integration\n- Testing, Adjusting & Balancing (TAB): comprehensive pre-functional testing and TAB required for ALL air and hydronic distribution systems before occupancy.\n- Performance verification: full functional performance testing of HVAC, electrical, plumbing, lighting and automation/control systems, confirming installed equipment matches design intent.\n- Fire integration: mechanical ventilation/air handling must integrate with the fire alarm system \u2014 smoke management, stairwell pressurisation, and automatic closure of fire/smoke dampers on alarm activation.\n!! Commissioning (H.8) and fire-system integration (H.9) are both PRE-occupancy requirements \u2014 neither is something to defer to post-handover snagging.\n\n## H.10 \u2014 Acoustics & Noise Isolation\n- Sound insulation: exterior fa\u00e7ades, floor slabs and inter-tenancy partitions must meet baseline Airborne Sound Insulation (R'w / STC) and Impact Sound Pressure Level (L'nT,w / IIC) standards.\n- Noise mitigation shields occupied spaces from outdoor traffic/aircraft noise, and restricts transmission between adjacent tenancies and residential sleeping quarters.\n- Vibration isolation: heavy mechanical plant (chillers, pumps, AHUs, exhaust fans) must sit on resilient vibration isolators, inertia bases and flexible duct/pipe connectors.\n- Acoustic attenuation: in-duct silencers/sound attenuators required within HVAC ductwork to control background mechanical noise in occupied spaces.\n!! Vibration isolation on plant equipment is an acoustics requirement, not just a maintenance nicety \u2014 rigid-mounted chillers/pumps transmit structure-borne noise throughout the building regardless of duct silencers.\n\n## H.11 \u2014 Digital Services & Smart ICT Infrastructure\n| Topology | Typical use |\n| Star | Primary ICT distribution \u2014 floor telecom rooms to workstations/wireless access points |\n| Ring | Backbone distribution in large facilities \u2014 loop redundancy, fault tolerance at controllers/gateways |\n| Bus | Field-device/sensor-controller level (e.g. fieldbus systems per ISO/IEC 61158) |\n| Wireless mesh | IoT sensor arrays, ad-hoc networks, smart building backbone \u2014 multi-hop routing resilience |\n- Interoperability: the ability of equipment/software from different manufacturers to exchange data openly within an integrated Building Management System (BMS).\n- BACnet: standardised open protocol for Building Automation Systems (BAS) controlling HVAC, lighting and primary plant.\n- MQTT: lightweight open IoT messaging protocol for real-time telemetry, sensor data and smart device connectivity.\n!! BACnet and MQTT solve different problems \u2014 BACnet is the BAS/plant-control backbone, MQTT is the lightweight IoT/sensor messaging layer. A digital-buildings design typically uses both, not one instead of the other."},

"## Legal Framework\n- Part J security design is enforced by the Security Industry Regulatory Agency (SIRA) under Law No. 12 of 2016 and By-Law Regulation 1-2018 (the Preventative Systems Manual).\n- SIRA guidelines govern security design for Part J, sitting alongside the DBC and UAE FLSC as the other primary compliance references for building design in Dubai.\n\n## Video Surveillance Systems (VSS) — Image Resolution Criteria\n| Criterion | Min. target size (% of display) | Purpose |\n| Detection (D) | 10% | Observe overall movement/activity in the scene |\n| Recognition (R) | 50% | Follow a previously identified individual |\n| Identification (I) | 120% | Facial identification of an unidentified target |\n!! D/R/I are three distinct performance tiers, not interchangeable — a camera configured only for Detection-level resolution cannot be relied on later for facial Identification. Match the tier to what the camera is actually meant to achieve.\n\n## Automated Surveillance Integration\n- City Ring: a monitored system that verifies and controls Automatic Number Plate Recognition (ANPR) across vehicle access points.\n- VideoGuard: SIRA's central monitoring platform, ensuring continuous functionality and operational health of a property's VSS deployment.\n\n## Physical & Access Controls\n- Electronic Access Control Systems (EACS).\n- Hostile Vehicle Mitigation (HVM) barriers.\n- Intrusion Detection Systems (IDS).\n- Dedicated Security Control Rooms.\n!! Which of these systems are mandatory scales with the building's occupancy classification — there is no single flat requirement that applies to every building type. Always check the specific classification before assuming a system is (or isn't) required.\n\nUse ✎ Edit to add further Part J detail (e.g. specific EACS/HVM/IDS thresholds by occupancy class) as more of the source becomes available."},
    {id:uid(),title:'Part K — Villas',imgs:[],notes:
"## K.1–K.4 — Scope & Performance Objectives\n- Part K governs private residential single-family dwellings, villas and townhouses (including villa communities) in Dubai — read together with the general provisions in Parts A–J.\n- Performance objectives span structural integrity, environmental integration, thermal performance, water conservation, indoor environmental quality, fire safety and utility integration.\n!! Part K does not replace Parts A–J — it adds villa-specific rules on top of them. Where Part K is silent on a topic, the general Parts still apply.\n\n## K.5 — Architectural & Site Design\n- Plot & site layout: designs must conform to the Affection Plan (site plan) for plot boundaries, setbacks, total building height and land use.\n- Daylighting & windows: habitable rooms (bedrooms, living rooms, kitchens) need net glazing window area of at least 10% of room floor area, OR daylight modelling showing a minimum of 150 lux.\n- Stairs & circulation: specific geometric limits apply to straight, curved, spiral and winder stairs — step dimensions, handrail placements and anti-slip tread finishes are all regulated.\n- Parking & garages: minimum dimensions set for single/double garages and driveways. Where a villa provides more than two parking bays, standard manoeuvring/parking dimensions apply (as for non-villa buildings).\n- Waste management: provisions for Eurobins, waste storage rooms and waste-area fire safety requirements.\n- Prohibited materials: direct ban on asbestos-containing materials; strict limits on lead/heavy metals in paints and coatings.\n!! The 10% glazing / 150 lux daylight rule is an either/or test — meeting one is sufficient, you don't need both.\n\n## K.7 — Building Envelope & Energy Efficiency\n- Thermal performance: overall U-value limits apply to external walls, roofs and glazed assemblies; roofs also carry a Solar Reflectance Index (SRI) requirement to reduce urban heat island effect.\n- Air leakage & vapour control: air barrier continuity and vapour resistance layers are required to prevent condensation and moisture damage in Dubai's hot, humid climate.\n- Glazing & balconies: impact-resistant safety glass required wherever occupants might collide with glazing or fall; protective guards/balustrades required for balconies and open roofs.\n- Solar PV systems: rooftop or façade-integrated photovoltaic panels must comply with Civil Defence fire codes and structural integrity standards.\n!! Vapour control is not optional trim in this climate — skipping the vapour resistance layer is a common cause of hidden condensation damage inside villa wall/roof assemblies.\n\n## K.8 — Structural Design & Geotechnics\n| Load type | Requirement |\n| Wind load | Minimum design wind pressure of 1 kN/m\u00b2 |\n| Seismic load | Designed under Risk Category II per ASCE 7-16 |\n- Structures engineered for combined dead, live, thermal, wind and seismic loads together — not each in isolation.\n- Geotechnical & foundations: a Geotechnical Interpretive Report (GIR) and soil investigation are mandatory before foundation design.\n- Foundation rules cover shallow foundations, deep/piled foundations, dewatering, and accepted ground improvement techniques (dynamic compaction, vibro-compaction, soil mixing, grouting).\n!! No GIR, no foundation design — this sequencing is mandatory, not just good practice.\n\n## K.9 — Utilities, Electrical & Telecom Services\n- Electrical safety & compliance: strict compliance with DEWA regulations and BS EN/IEC standards, with proper grounding/earthing and bonding throughout.\n- Double-pole switches with neon indicators are MANDATORY for water heaters, saunas, Jacuzzis and other heavy appliances.\n- Distribution boards (DBs) must remain accessible at all times — never boxed in or obstructed.\n- Water supply & metering: DEWA-approved smart meters required for consumption monitoring.\n- Telecommunications: standardised fibre-optic infrastructure, communication cabinets (e.g. 12U cabinets for small/medium villas), pull boxes and a uniform cable labelling scheme for future-proofing.\n!! The double-pole + neon indicator rule for water heaters/saunas/Jacuzzis is a specific, commonly-missed site item — a single-pole switch here is a compliance fail even if the wiring itself is otherwise correct.\n\n## K.10–K.11 — Indoor Environment, MEP & Life Safety\n- HVAC & IAQ: mandatory energy-efficient cooling systems, proper ventilation rates, and formal commissioning of HVAC equipment before handover.\n- Plumbing & drainage: pipe sizing based on peak fixture demand; floor drains required in all wet areas.\n- Soakaways: permitted for SURFACE WATER drainage only (not foul/grey water), and the soakaway base must sit at least 1 m above the winter water table.\n- Fire & life safety: villas/townhouses with ground floor gross area >1,500 m\u00b2 OR basement gross area >1,500 m\u00b2 require full sprinkler protection and hose reels.\n- Mandatory connection to Dubai Civil Defence control centres via the Hassantuk for Homes smart monitoring system.\n- Acoustic insulation: building envelopes, party walls and floor assemblies must meet sound insulation standards (per Approved Document E) to limit noise transmission between dwellings and sleeping areas.\n!! The 1,500 m\u00b2 sprinkler trigger applies separately to ground floor AND basement — a large basement alone can trigger full sprinkler protection even if the ground floor footprint is smaller."},

  ];
}

 q(PD,'Design Method 1 (prescriptive elevator counts) is appropriate for:',['Any building regardless of use mix','Single-occupancy buildings with associated facilities like parking or ground floor retail','Only residential towers','Mixed-use towers combining hotel and office'],1,'D.8.1 Note 1: Method 1 suits single-occupancy buildings; mixed-use buildings (e.g. 50% hotel/50% office) require Method 2.'),
 q(PD,'Which occupancy rate applies to a 2-bedroom residential apartment for elevator population estimation?',['1.8 persons','2.5 persons','3 persons','4 persons'],2,'Table D.5: 2-bedroom apartments use an occupancy rate of 3 persons for elevator population estimation.'),
 q(PD,'Elevator suites of standards (ASME A17 vs BS EN 81):',['Can be freely mixed on the same project','Shall be used interchangeably as needed','One suite shall be selected per project and not mixed','Must always be ASME A17 in the UAE'],2,'D.5: one suite of standards shall be selected for a project; the suites shall not be used interchangeably.'),
 q(PD,'Which handling capacity (HC5%) ceiling applies to regular office buildings outside lunch peak?',['8%','10%','12%','15%'],2,'Table D.32: regular office handling capacity ceiling is 12% (rising to 13% during lunch peak per Table D.33).'),
 q(PD,'The maximum recommended acceleration for a bed (stretcher) elevator is:',['0.6 m/s²','0.8 m/s²','1.0 m/s²','1.2 m/s²'],0,'D.9.8.2: bed elevators are capped at 0.6 m/s² acceleration and 1.0 m/s³ jerk, regardless of rated speed.'),
 q(PD,'Destination Control Systems (DCS) are generally preferred over conventional systems when:',['All elevators serve an equal number of stops','Up-peak traffic is not demanding','The building has multiple function areas/mixed uses and tenant enrolment access control','The building is a small single-tenant villa'],2,'D.9.8.3: DCS is preferred where elevators don\'t serve equal stops, up-peak traffic is demanding, there are multiple function areas, or tenants/visitors enrol for access.'),
 q(PD,'The building shall provide a safe, sustainable, adequate and effective vertical transportation service — this performance statement (D.1) is met by following:',['D.1 only','D.2 and D.3 only','D.4 to D.9','The Annex in D.10 only'],2,'D.1: the performance statement is met by following the prescriptive/performance requirements of D.4 through D.9.'),

 q(PD,'Elevators in new buildings must include energy-efficient lighting that shuts off after a maximum inactivity period of:',['3 minutes','5 minutes','10 minutes','15 minutes'],1,'D.6.1: elevator lighting controls must switch off after a maximum of 5 minutes of inactivity, with luminous efficacy greater than 70 lumens per circuit-Watt.'),
 q(PD,'Escalators and moving walks must fully shut down (with soft-start on restart) after a maximum inactivity period of:',['3 minutes','5 minutes','10 minutes','15 minutes'],3,'D.6.2: escalators/moving walks reduce speed after 3 minutes of no activity and fully shut down after a maximum of 15 minutes.'),
 q(PD,'Doors from apartments or other residential accommodation shall NOT open directly into:',['A fire stair','An elevator lobby','A service corridor','A refuse room'],1,'D.7.2.1: residential unit doors must not open directly into an elevator lobby.'),
 q(PD,'The distance between two elevator cores arranged facing each other shall be capped at a maximum of:',['3.0 m','3.6 m','4.5 m','6.0 m'],2,'D.7.3.3: facing elevator cores are spaced at the greatest of 2.4 m minimum / 2× deepest cabin depth / 1.5× firefighting cabin depth, but never exceeding 4.5 m.'),

 q(PD,'Section 2.9, Ch.2 of UAE FLSC requires at least one firefighting elevator in which of these building types?',['Any two-storey villa','A mall, multi-storey amusement park, or high-rise/super high-rise/high-depth building','Any building with a basement','Only buildings taller than 300 m'],1,'D.8.3.1: firefighting elevators are mandated for malls, multi-storey amusement parks and buildings classed high-rise, super high-rise or high-depth.'),
 q(PE,'A guardrail or equivalent structural resistance is required for building envelope elements protecting a change in level greater than:',['500 mm','600 mm','760 mm','900 mm'],2,'E.4.1.4: parts of the envelope protecting a change in level greater than 760 mm need structural resistance per ASCE 4.5.1 or a guardrail per B.4.2.5.2.'),
 q(PE,'For storey-height envelope assemblies with a span of 3,000 mm to 7,500 mm, the maximum deflection is:',['1/200','5 mm + 1/300','1/250','1/90'],1,'Table E.1: storey-height assemblies between 3,000 mm and 7,500 mm span are limited to 5 mm + 1/300.'),
 q(PE,'The minimum hard-body safety impact energy for opaque envelope areas within 1.5 m of ground level is:',['3 J','6 J','10 J','120 J'],2,'Table E.2: hard body safety impact for areas within 1.5 m of ground/FFL is 10 J.'),
 q(PE,'Under operational forces, envelope surfaces must sustain a uniformly distributed load or point load of:',['0.3 kN/m² or 0.5 kN','0.6 kN/m² or 1 kN','1.0 kN/m² or 1.5 kN','1.5 kN/m² or 2 kN'],1,'E.4.1.4: a uniformly distributed 0.6 kN/m² or a 1 kN vertical load, whichever is more onerous.'),
 q(PE,'Fixings securing the building envelope shall:',['Be welded for maximum strength','Never be welded','Be welded only above 15 m height','Be welded only in seismic zones'],1,'E.4.1.7: fixings shall not be welded.'),
 q(PE,'The maximum window-to-wall ratio (WWR) for glazed façades of a residential building (except shopfronts) is:',['30% of gross wall area','40% of gross wall area','50% of gross wall area','60% of gross wall area'],1,'E.5.2.1: residential buildings are capped at 40% WWR; all other building types at 60%.'),

 q(PE,'The maximum average thermal transmittance permitted for a roof (non-glazed) is:',['0.2 W/m²K','0.3 W/m²K','0.4 W/m²K','0.57 W/m²K'],1,'Table E.4: roof thermal transmittance shall not exceed 0.3 W/m²K.'),
 q(PE,'For ground-contact floors, the thermal transmittance requirement is achieved by installing perimeter insulation of:',['0.5 m','1 m','1.5 m','2 m'],1,'E.5.2.3.1: 1 m of perimeter insulation is used to meet the ground-floor thermal transmittance requirement.'),

 q(PE,'Opaque roof surfaces must achieve the required solar reflectance index (SRI) over a minimum of what percentage of the roof area?',['50%','60%','75%','90%'],2,'E.5.7/Table E.8: SRI requirements apply to a minimum of 75% of the roof area.'),

 q(PE,'Maximum average lighting power density for exterior building envelope lighting is:',['1.5 W/m²','2.2 W/m²','3.0 W/m²','4.5 W/m²'],1,'E.5.8: exterior lighting power density shall not exceed 2.2 W/m² per illuminated surface (or 16.4 W/linear metre).'),

 q(PE,'Overhead glazing (skylights) shall be:',['Toughened only','Laminated with a post-breakage containment system','Wired glass only','Any glass type, no special requirement'],1,'E.9.5: overhead glazing shall be laminated and include a post-breakage containment system.'),

 q(PE,'Signboards or billboards on a façade must be fire tested as part of the façade system when their cumulative surface area exceeds:',['20 m²','35 m²','50 m²','75 m²'],2,'E.10.9: signboards/billboards exceeding 50 m² cumulative area (or straddling more than one storey) require façade-system fire testing.'),

function buildAcronymSection(){
  var data=seedAcronymsData();
  var notes=data.map(function(group){
    var lines=group[1].map(function(pair){return '- '+pair[0]+' \u2014 '+pair[1];}).join('\n');
    return '## '+group[0]+'\n'+lines;
  }).join('\n');
  notes='This glossary lists every acronym/abbreviation used across the Dubai Building Code. Admin can mark specific terms as "important" in Manage \u2192 Acronym Bank \u2014 only those marked terms are used to generate exam questions.\n\n'+notes;
  return {id:uid(),title:'Acronyms & Abbreviations',imgs:[],notes:notes};
}
var DEFAULT_IMPORTANT_ACRONYMS=['DBC','DEWA','DCD','SIRA','TRA','RTA','DCAA','DDA','DSOA','KHDA','IACAD','DTCM','DHA','MEP','HVAC','FCU','RCD','MCB','MCCB','DB','MDB','SMDB','GFA','FAR','GA','NA','BMS','BMU','LPG','EV','EVSE','PV','WWR','SRI','GIR','DCR','DLTM','VT','VVVF','DCS','ASCE','ACI','AISC','ASHRAE','NFPA','UAE FLSC','PTV','LRV','ETS','MTR','FTR','ODF','IRATA','Etisalat','du','BS','BS EN','IEC'];
function buildAcronymList(){
  var data=seedAcronymsData();
  var list=[];
  data.forEach(function(group){
    group[1].forEach(function(pair){
      list.push({id:uid(),term:pair[0],def:pair[1],important:DEFAULT_IMPORTANT_ACRONYMS.indexOf(pair[0])>=0});
    });
  });
  return list;
}
function shuffleArr(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function genAcronymQuestions(c,count){
  var important=(c.acronyms||[]).filter(function(a){return a.important;});
  if(important.length<4||count<=0)return[];
  var picks=shuffleArr(important).slice(0,Math.min(count,important.length));
  return picks.map(function(item){
    var distractSource=important.filter(function(a){return a.id!==item.id;});
    var distractors=shuffleArr(distractSource).slice(0,3).map(function(a){return a.def;});
    var opts=shuffleArr(distractors.concat([item.def]));
    var correctIdx=opts.indexOf(item.def);
    return {id:'acr-'+uid(),sec:'Acronyms & Abbreviations',q:'What does "'+item.term+'" stand for in the DBC?',opts:opts,c:correctIdx,ex:item.term+' = '+item.def+'.'};
  });
}
function materializeAcronymQuestions(c){
  var important=(c.acronyms||[]).filter(function(a){return a.important;});
  if(important.length<4)return 0;
  var existingTerms={};
  c.questions.forEach(function(q){if(q.acrTerm)existingTerms[q.acrTerm]=true;});
  var added=0;
  important.forEach(function(item){
    if(existingTerms[item.term])return;
    var distractSource=important.filter(function(a){return a.id!==item.id;});
    var distractors=shuffleArr(distractSource).slice(0,3).map(function(a){return a.def;});
    if(distractors.length<3)return;
    var opts=shuffleArr(distractors.concat([item.def]));
    var correctIdx=opts.indexOf(item.def);
    c.questions.push({id:uid(),sec:'Acronyms & Abbreviations',q:'What does "'+item.term+'" stand for in the DBC?',opts:opts,c:correctIdx,ex:item.term+' = '+item.def+'.',acrTerm:item.term});
    added++;
  });
  return added;
}
function renderNotes(txt,imgs){
  imgs=imgs||[];
  var box=div('notes'),lines=String(txt||'').split('\n'),i=0;
  while(i<lines.length){
    var L=lines[i];
    var im=L.match(/^\[img:(\d+)\]\s*$/);
    if(im){
      var idx=parseInt(im[1])-1;
      if(imgs[idx])box.appendChild(el('img',{src:imgs[idx],alt:'figure '+im[1]}));
      i++;continue;
    }
    if(/^\|/.test(L)){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}));i++;}
      var tb=el('table');rows.forEach(function(r,ri){var tr=el('tr');r.forEach(function(c){tr.appendChild(el(ri===0?'th':'td',{text:c}));});tb.appendChild(tr);});
      box.appendChild(tb);continue;
    }
    if(/^## /.test(L)){box.appendChild(el('h4',{text:L.slice(3)}));i++;continue;}
    if(/^!! /.test(L)){box.appendChild(div('warnbox',['⚠ '+L.slice(3)]));i++;continue;}
    if(/^- /.test(L)){var ul=el('ul');while(i<lines.length&&/^- /.test(lines[i])){ul.appendChild(el('li',{text:lines[i].slice(2)}));i++;}box.appendChild(ul);continue;}
    if(L.trim()){box.appendChild(el('p',{text:L}));}
    i++;
  }
  return box;
}

function examTimerAdvance(){

function startQuiz(c,n){
  clearExamTimer();
  var importantCount=(c.acronyms||[]).filter(function(a){return a.important;}).length;
  var acrWant=Math.min(c.acronymQuizCount||0,importantCount,n);
  var staticN=Math.max(0,n-acrWant);
  var staticPool=shuffleArr(c.questions.filter(function(q){return q.sec!=='Acronyms & Abbreviations';}));
  var staticQs=staticPool.slice(0,Math.min(staticN,staticPool.length));
  var acrQs=acrWant>0?genAcronymQuestions(c,acrWant):[];
  var combined=staticQs.concat(acrQs);
  QZ={cid:c.id,qs:combined,ans:new Array(combined.length).fill(-1),cur:0};
  vQuiz();

function shrinkImage(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    var maxW=1400;
    if(img.width<=maxW){cb(dataUrl);return;}
    var scale=maxW/img.width;
    var cv=document.createElement('canvas');
    cv.width=maxW;cv.height=Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',0.82));
  };
  img.onerror=function(){cb(dataUrl);};
  img.src=dataUrl;
}
function admEditSection(c,s,returnTab){
  var rt=returnTab||'manage';
  var isNew=!s;if(isNew)s={id:uid(),title:'',notes:'',imgs:[]};
  var imgs=secImgs(s).slice();
  var tI=el('input',{placeholder:'Section title'});tI.value=s.title;
  var nI=el('textarea',{placeholder:'Notes. Formatting: "## " heading, "- " bullet, "| a | b |" table row, "!! " warning box, "[img:2]" places image #2 inline'});
  nI.value=s.notes||'';
  var gal=div('imggal');
  function renderGal(){
    gal.innerHTML='';
    if(!imgs.length){gal.appendChild(el('span',{cls:'sub',text:'No images yet. Image #1 is the cover (always visible); others show inside the collapsible details.'}));return;}
    imgs.forEach(function(im,idx){
      var th=div('thumb',[
        el('img',{src:im}),
        el('span',{cls:'tag',text:idx===0?'#1 COVER':'#'+(idx+1)}),
        el('button',{cls:'rm',text:'✕',onclick:function(){imgs.splice(idx,1);renderGal();}})
      ]);
      gal.appendChild(th);
    });
  }
  renderGal();
  var imgI=el('input',{type:'file',accept:'image/*',multiple:''});
  imgI.addEventListener('change',function(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    if(!files.length)return;
    var pending=files.length;
    files.forEach(function(f){
      var fr=new FileReader();
      fr.onload=function(){
        shrinkImage(fr.result,function(small){
          imgs.push(small);
          pending--;if(pending===0){renderGal();toast(files.length+' image(s) attached');}
        });
      };
      fr.readAsDataURL(f);
    });
  });
  var urlI=el('input',{placeholder:'https://sdmbrk.github.io/imgs/figure1.png',type:'url'});

    fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(bl){
      var fr=new FileReader();
      fr.onload=function(){shrinkImage(fr.result,function(small){imgs.push(small);renderGal();urlI.value='';toast('Image added');});};
      fr.readAsDataURL(bl);
    }).catch(function(){toast('Image download failed — check URL/CORS (GitHub Pages works)');});
  });
  var m=modal((isNew?'Add':'Edit')+' study section',[
    div('field',[el('label',{text:'Title'}),tI]),
    div('field',[el('label',{text:'Images ('+'#1 = cover, rest in details; use [img:N] in notes for inline placement)'}),gal]),

    div('field',[el('label',{text:'Add image from URL (works on mobile)'}),urlI,urlBtn]),
    div('field',[el('label',{text:'Notes'}),nI]),
    btn('Save section','pri',function(){
      if(!tI.value.trim()){toast('Title required');return;}
      s.title=tI.value.trim();s.notes=nI.value;s.imgs=imgs;s.img=imgs[0]||null;
      if(isNew)c.sections.push(s);
      save();m.remove();vCat(c.id,rt);toast('Section saved');
    })
  ],true);

  nmI.addEventListener('input',redraw);
  nmI.addEventListener('change',save);
  var btnrow=el('div',{style:'display:flex;gap:10px;margin-top:14px;flex-wrap:wrap'});
  btnrow.appendChild(btn('⬇ Download PDF','grn',function(){certPdf(cv,r);}));
  btnrow.appendChild(btn('⬇ Download PNG','',function(){
    var a=el('a',{href:cv.toDataURL('image/png'),download:'Certificate_'+r.vid+'.png'});
    document.body.appendChild(a);a.click();a.remove();
  }));
  modal('Certificate — '+r.exam,[
    div('field',[el('label',{text:'Candidate name'}),nmI]),
    cv,
    btnrow
  ],true);
  redraw();
  save();
}
function drawCert(cv,r){
  var W=2000,H=1414;cv.width=W;cv.height=H;
  var x=cv.getContext('2d');
  x.fillStyle='#FDFDFB';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(14,124,123,0.05)';x.lineWidth=1;
  var g;
  for(g=0;g<W;g+=50){x.beginPath();x.moveTo(g,0);x.lineTo(g,H);x.stroke();}
  for(g=0;g<H;g+=50){x.beginPath();x.moveTo(0,g);x.lineTo(W,g);x.stroke();}
  x.strokeStyle='#0E7C7B';x.lineWidth=14;x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='#C9A227';x.lineWidth=3;x.strokeRect(68,68,W-136,H-136);
  x.strokeStyle='#C9A227';x.lineWidth=5;
  [[90,90,1,1],[1910,90,-1,1],[90,1324,1,-1],[1910,1324,-1,-1]].forEach(function(k){
    x.beginPath();x.moveTo(k[0],k[1]+40*k[3]);x.lineTo(k[0],k[1]);x.lineTo(k[0]+40*k[2],k[1]);x.stroke();
  });
  x.textAlign='center';
  x.fillStyle='#0E7C7B';x.font='700 26px "Segoe UI",Arial';
  x.fillText('S D M B R K   C O L L E C T I O N S',W/2,150);
  x.fillStyle='#8A948F';x.font='400 22px "Segoe UI",Arial';
  x.fillText('Regulatory Learning & Certification Portal',W/2,186);
  x.fillStyle='#1C2422';x.font='400 88px Georgia,serif';
  x.fillText('Certificate of Achievement',W/2,300);
  x.strokeStyle='#C9A227';x.lineWidth=3;
  x.beginPath();x.moveTo(W/2-260,330);x.lineTo(W/2+260,330);x.stroke();
  x.fillStyle='#5F6B67';x.font='400 30px "Segoe UI",Arial';
  x.fillText('This is to certify that',W/2,410);
  x.fillStyle='#0A5B5A';x.font='italic 700 80px Georgia,serif';
  x.fillText(r.name||'Candidate Name',W/2,510);
  x.strokeStyle='#DDE4E1';x.lineWidth=2;
  x.beginPath();x.moveTo(W/2-480,535);x.lineTo(W/2+480,535);x.stroke();
  x.fillStyle='#5F6B67';x.font='400 30px "Segoe UI",Arial';
  x.fillText('has successfully completed the examination for',W/2,600);
  x.fillStyle='#1C2422';x.font='700 52px "Segoe UI",Arial';
  x.fillText(r.exam,W/2,670);
  x.fillStyle='#5F6B67';x.font='400 30px "Segoe UI",Arial';
  x.fillText('with a score of',W/2,740);
  x.fillStyle='#16A34A';x.font='800 76px "Segoe UI",Arial';
  x.fillText(r.pct+'%',W/2,825);
  x.fillStyle='#E7F6EC';roundRect(x,W/2-140,860,280,64,32);x.fill();
  x.strokeStyle='#16A34A';x.lineWidth=3;roundRect(x,W/2-140,860,280,64,32);x.stroke();
  x.fillStyle='#116B33';x.font='800 34px "Segoe UI",Arial';
  x.fillText('P A S S E D',W/2,904);
  drawSeal(x,W-330,H-330,120);
  x.textAlign='left';x.fillStyle='#5F6B67';x.font='400 26px "Segoe UI",Arial';
  x.fillText('Date of issue',180,H-240);
  x.fillStyle='#1C2422';x.font='700 32px "Segoe UI",Arial';
  x.fillText(r.date,180,H-198);
  x.fillStyle='#5F6B67';x.font='400 26px "Segoe UI",Arial';
  x.fillText('Verification ID',180,H-140);

  x.textAlign='center';
  x.fillStyle='#8A948F';x.font='400 22px "Segoe UI",Arial';
  x.fillText('Sdmbrk Collections · Pass mark '+(r.passMark||70)+'% · Verify using the ID above within the portal',W/2,H-60);
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function drawSeal(x,cx,cy,R){
  x.save();
  var n=28;x.beginPath();
  for(var i=0;i<=n*2;i++){var ang=i*Math.PI/n;var rr=(i%2===0)?R:R*0.9;x.lineTo(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang));}
  x.closePath();
  var gr=x.createRadialGradient(cx-30,cy-30,10,cx,cy,R);
  gr.addColorStop(0,'#E8CE7A');gr.addColorStop(0.6,'#C9A227');gr.addColorStop(1,'#9E7E17');
  x.fillStyle=gr;x.fill();
  x.beginPath();x.arc(cx,cy,R*0.74,0,Math.PI*2);x.strokeStyle='rgba(255,255,255,0.65)';x.lineWidth=3;x.stroke();
  x.fillStyle='#5C4A0D';x.textAlign='center';
  x.font='800 30px "Segoe UI",Arial';x.fillText('CERTIFIED',cx,cy-6);
  x.font='700 20px "Segoe UI",Arial';x.fillText('OFFICIAL PASS',cx,cy+26);
  x.fillStyle='#9E7E17';
  x.beginPath();x.moveTo(cx-46,cy+R*0.8);x.lineTo(cx-26,cy+R+74);x.lineTo(cx-6,cy+R+50);x.lineTo(cx-6,cy+R*0.8);x.closePath();x.fill();
  x.beginPath();x.moveTo(cx+46,cy+R*0.8);x.lineTo(cx+26,cy+R+74);x.lineTo(cx+6,cy+R+50);x.lineTo(cx+6,cy+R*0.8);x.closePath();x.fill();
  x.restore();
}
function downloadReviewPdf(r){
  function make(){
    var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var pageW=210,pageH=297,margin=16,maxW=pageW-margin*2;
    var y=margin;
    function addFooter(){
      pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(140,148,143);
      pdf.text('Sdmbrk Collections - Regulatory Learning & Certification Portal',margin,pageH-8);
    }
    function ensureSpace(need){
      if(y+need>pageH-margin){addFooter();pdf.addPage();y=margin;}
    }
    pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.setTextColor(14,124,123);
    pdf.text('SDMBRK COLLECTIONS',margin,y);y+=6;
    pdf.setFont('helvetica','bold');pdf.setFontSize(18);pdf.setTextColor(28,36,34);
    pdf.text('Exam Answer Review',margin,y);y+=8;
    pdf.setFont('helvetica','normal');pdf.setFontSize(11);pdf.setTextColor(95,107,103);
    pdf.text(r.exam,margin,y);y+=6;
    pdf.setFontSize(10);
    var metaLine=(r.name?r.name+' - ':'')+r.date+' - Score '+r.score+'/'+r.total+' ('+r.pct+'%) - '+(r.pass?'PASSED':'FAILED')+' - Pass mark '+(r.passMark||70)+'%';
    pdf.splitTextToSize(metaLine,maxW).forEach(function(l){pdf.text(l,margin,y);y+=5;});
    pdf.text('Verification ID: '+r.vid,margin,y);y+=8;
    pdf.setDrawColor(221,228,225);pdf.line(margin,y,pageW-margin,y);y+=8;
    (r.qs||[]).forEach(function(q,idx){
      var ok=q.a===q.c;
      ensureSpace(14);
      pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.setTextColor(28,36,34);
      pdf.splitTextToSize((idx+1)+'. '+q.q,maxW).forEach(function(l){ensureSpace(6);pdf.text(l,margin,y);y+=6;});
      if(q.sec){pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(140,148,143);ensureSpace(5);pdf.text(String(q.sec).toUpperCase(),margin,y);y+=5;}
      q.opts.forEach(function(o,oi){
        var isCorrect=oi===q.c,isYourWrong=oi===q.a&&!ok;
        var prefix=isCorrect?'+ ':(isYourWrong?'x ':'  ');
        var suffix=isCorrect?'  (correct answer)':(isYourWrong?'  (your answer)':'');
        var color=isCorrect?[17,107,51]:(isYourWrong?[192,57,43]:[95,107,103]);
        pdf.setFont('helvetica',(isCorrect||isYourWrong)?'bold':'normal');pdf.setFontSize(10);pdf.setTextColor(color[0],color[1],color[2]);
        pdf.splitTextToSize(prefix+String.fromCharCode(65+oi)+'. '+o+suffix,maxW-4).forEach(function(l){ensureSpace(5.5);pdf.text(l,margin+4,y);y+=5.5;});
      });
      if(q.a<0){pdf.setFont('helvetica','italic');pdf.setFontSize(9);pdf.setTextColor(140,148,143);ensureSpace(5);pdf.text('Not answered in time.',margin+4,y);y+=5;}
      if(q.ex){
        pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(95,107,103);
        pdf.splitTextToSize('Note: '+q.ex,maxW-4).forEach(function(l){ensureSpace(5);pdf.text(l,margin+4,y);y+=5;});
      }
      y+=4;
    });
    addFooter();
    pdf.save('Exam_Review_'+r.vid+'.pdf');
  }
  if(window.jspdf){make();return;}
  var s=el('script',{src:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'});
  s.onload=make;
  s.onerror=function(){toast('Could not load the PDF library — check your internet connection and try again.');};
  document.head.appendChild(s);
}
function certPdf(cv,r){
  function make(){
    var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',0,0,297,210);
    pdf.save('Certificate_'+r.vid+'.pdf');
  }
  if(window.jspdf){make();return;}
  var s=el('script',{src:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'});
  s.onload=make;
  s.onerror=function(){toast('Offline — downloading PNG instead');var a=el('a',{href:cv.toDataURL('image/png'),download:'Certificate_'+r.vid+'.png'});document.body.appendChild(a);a.click();a.remove();};
  document.head.appendChild(s);
}
